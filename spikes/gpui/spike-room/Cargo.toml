[package]
name = "spike-room"
version = "0.1.0"
edition = "2024"
publish = false
description = "Plan 260 S0.8: LiveKit's Rust SDK as the talk-show host, the way the backend would hold it (D9)."

[features]
default = ["room"]
# Without it the binary is the same program minus the SDK: the size baseline.
room = ["dep:livekit", "dep:livekit-api"]

[dependencies]
livekit = { version = "=0.12.0", optional = true }
livekit-api = { version = "*", optional = true, default-features = false, features = ["access-token", "services-tokio", "rustls-tls-native-roots"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
futures = "0.3"
png = "0.17"
anyhow = "1"


# Its own workspace: libwebrtc (a 264 MB prebuilt download) stays out of the
# spikes workspace the Windows contributors build for the GPUI spikes.
[workspace]
