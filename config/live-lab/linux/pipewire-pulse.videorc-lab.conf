# Plan 179: the Linux lab's two audio devices (the twin of BlackHole 2ch on
# the lab Mac). Install as the lab user:
#
#   mkdir -p ~/.config/pipewire/pipewire-pulse.conf.d
#   cp config/live-lab/linux/pipewire-pulse.videorc-lab.conf \
#     ~/.config/pipewire/pipewire-pulse.conf.d/videorc-lab.conf
#   systemctl --user restart pipewire-pulse
#
# videorc_lab_speech  a null sink. The harness plays scripted speech into it
#                     (ffmpeg -f pulse -device videorc_lab_speech) and the
#                     test card's Chrome plays its 10 s sync click into it
#                     (PULSE_SINK), so nothing reaches the speakers.
# videorc_lab_mic     a remap source over videorc_lab_speech.monitor. Videorc
#                     hides monitor sources, so the lab mic must be a real
#                     source; this is the one the lab profile selects.
#
# Linux Videorc has no system-audio capture yet, so the click rides on the
# mic together with the speech (speech never plays within 1 s of a pulse,
# lib/speech.mjs). Neither device may become the system default: the doctor
# fails when one is. If WirePlumber picks one anyway, set your real devices
# back: pactl set-default-sink <speakers>; pactl set-default-source <mic>.
#
# One-off test without the file:
#   pactl load-module module-null-sink sink_name=videorc_lab_speech sink_properties=device.description=Videorc-Lab-Speech
#   pactl load-module module-remap-source master=videorc_lab_speech.monitor source_name=videorc_lab_mic source_properties=device.description=Videorc-Lab-Mic

pulse.cmd = [
  { cmd = "load-module" args = "module-null-sink sink_name=videorc_lab_speech sink_properties=device.description=Videorc-Lab-Speech" flags = [ ] }
  { cmd = "load-module" args = "module-remap-source master=videorc_lab_speech.monitor source_name=videorc_lab_mic source_properties=device.description=Videorc-Lab-Mic" flags = [ ] }
]
