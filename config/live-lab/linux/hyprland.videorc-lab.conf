# Plan 179: the Linux lab display, a Hyprland headless output (the twin of
# the BetterDisplay virtual screen / HDMI dummy on the lab Mac). Videorc
# captures it through xdg-desktop-portal-hyprland like any monitor; the
# test card runs fullscreen on it and nothing else ever does.
#
# Add to the lab user's Hyprland config (Omarchy: ~/.config/hypr/hyprland.conf
# sources ~/.config/hypr/*.conf; put this in its own file and `source =` it):
#
#   source = ~/.config/hypr/videorc-lab.conf
#
# then `hyprctl reload`, and tell the lab its name once:
#
#   pnpm live:hookup --lab-display videorc-lab
#
# Placed far to the right so the pointer never wanders onto it, 1920x1080 at
# 30 Hz like the lab stream, scale 1 (the card's markers are pixel exact).

monitor = videorc-lab, 1920x1080@30, 20000x0, 1
exec-once = hyprctl output create headless videorc-lab
