[workspace]
members = [
    "crates/videorc-backend",
    "crates/videorc-native-preview-addon",
    "crates/videorc-wer-helper",
    # Plan 260 (the desktop app in GPUI). S1.0 adds every crate the plan adds,
    # empty, so no later slice edits this manifest; each crate's README names
    # the lane that owns it.
    "crates/videorc-protocol",
    "crates/videorc-app-core",
    "crates/videorc-preview",
    "crates/videorc-gpu-import",
    "crates/videorc-preview-ring",
    "crates/videorc-updater",
    "crates/videorc-page-host",
    "crates/videorc-kit",
    "apps/videorc",
]
# The patched GPUI platform crate below is a path dependency inside this
# folder: keep it out of the workspace so `cargo fmt --all` and clippy leave
# Zed's code as it was published.
exclude = ["patches"]
resolver = "3"

# Plan 260: depend on a plan crate with `<name> = { workspace = true }`.
[workspace.dependencies]
videorc-protocol = { path = "crates/videorc-protocol" }
videorc-app-core = { path = "crates/videorc-app-core" }
videorc-preview = { path = "crates/videorc-preview" }
videorc-gpu-import = { path = "crates/videorc-gpu-import" }
videorc-preview-ring = { path = "crates/videorc-preview-ring" }
videorc-updater = { path = "crates/videorc-updater" }
videorc-page-host = { path = "crates/videorc-page-host" }
videorc-kit = { path = "crates/videorc-kit" }
# Plan 260 D1: GPUI as the weekly gpui-pre snapshot, pinned exactly, one pin
# for the kit and the app (`pnpm ui:check` compares it with videorc-ui's).
# A bump is its own PR. Features are the user's: `runtime_shaders` for builds
# without Xcode's Metal Toolchain (development only), `font-kit` on macOS,
# `wayland`/`x11` on Linux.
gpui = { package = "gpui-pre", version = "=0.3.14" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.14" }
# The kit's own (`pnpm ui:check` compares them with videorc-ui's): gpui-base
# is cut against gpui-pre 0.3.14; resvg and image are the chrome raster's, at
# the versions gpui-pre itself builds.
gpui_base = { package = "gpui-base", version = "=0.11.0" }
resvg = { version = "=0.46.0", default-features = false }
image = { version = "0.25", default-features = false }
smallvec = "1"
qrcode = { version = "0.14", default-features = false }

# GPUI patches (plan 260 D1: our own copy of only the patched crate, pinned to
# the version it was cut from; a fourth patch is a STOP), copied from
# videorc-ui's gpui/patches/.
#
# 1. gpui-pre-apple 0.3.14: system-font instances, and font weights read on
#    Apple's NSFontWeight scale, so weight 500 draws SF Medium instead of
#    Regular (S0.4). The diff is `patches/gpui-pre-apple.patch`. Drop it when
#    a gpui-pre release carries the fix upstream (zed-industries/zed#67416).
# 2. gpui-pre 0.3.14: AccessKit node bounds in `debug_a11y_tree_json` so the
#    UI driver can click and focus (plan 260 S2.5 gap 1), and
#    `Window::activate_a11y_in_process` so the driver builds the tree on Linux,
#    where the switch is the desktop's AT-SPI flag (L6), and
#    `NativeView::set_ignores_mouse` so the wheel over the docked Preview
#    scrolls the page as in Electron (L1). The diff is
#    `patches/gpui-pre.patch`. Drop each part when a gpui-pre release has it.
[patch.crates-io]
gpui-pre-apple = { path = "patches/gpui-pre-apple" }
gpui-pre = { path = "patches/gpui-pre" }

# Disable incremental codegen for dev builds. On macOS arm64, stale incremental
# serde codegen artifacts have produced invalid links for the backend binary.
[profile.dev]
incremental = false

# The backend runs real-time per-pixel work (e.g. camera YUV->BGRA conversion at 4K).
# An unoptimized debug build makes that ~50x slower (hundreds of ms/frame), which
# starves capture. Optimize the backend crate even in dev so `pnpm dev` behaves like
# the shipped build; its hot paths are otherwise GPU/hardware so this is cheap at runtime.
[profile.dev.package.videorc-backend]
opt-level = 2

[profile.dev.package.videorc-native-preview-addon]
opt-level = 2

# Plan 260: the preview presents every video frame on its own thread (plan
# 220 measured its dev build at opt-level 2); optimise it as the addon is.
[profile.dev.package.videorc-preview]
opt-level = 2

[profile.dev.package.videorc-gpu-import]
opt-level = 2

[profile.dev.package.videorc-preview-ring]
opt-level = 2

# The per-frame heavy lifting also runs inside dependencies (serde event
# serialization, objc2/Metal bindings, image encode, tokio); at opt-level 0
# they multiply dev CPU several-fold. Optimizing them costs one cached rebuild.
[profile.dev.package."*"]
opt-level = 2
