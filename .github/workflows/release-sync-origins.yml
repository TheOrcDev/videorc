name: Reconcile release origins
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  prepare:
    name: Prepare missing immutable mirror history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-publication
    permissions:
      contents: read
      actions: write
    env:
      VIDEORC_RELEASE_CONTROLLER_ENABLED: ${{ vars.VIDEORC_RELEASE_CONTROLLER_ENABLED }}
      VIDEORC_RELEASE_CONTROL_PREFIX: ${{ vars.VIDEORC_RELEASE_CONTROL_PREFIX }}
      VIDEORC_RELEASE_CONTROL_S3_BUCKET: ${{ vars.VIDEORC_RELEASE_CONTROL_S3_BUCKET }}
      VIDEORC_RELEASE_CONTROL_S3_REGION: ${{ vars.VIDEORC_RELEASE_CONTROL_S3_REGION }}
      VIDEORC_RELEASE_CONTROL_S3_ENDPOINT_URL: ${{ vars.VIDEORC_RELEASE_CONTROL_S3_ENDPOINT_URL }}
      VIDEORC_RELEASE_CONTROL_S3_FORCE_PATH_STYLE: ${{ vars.VIDEORC_RELEASE_CONTROL_S3_FORCE_PATH_STYLE }}
      VIDEORC_RELEASE_UPLOAD_S3_BUCKET: ${{ vars.VIDEORC_RELEASE_UPLOAD_S3_BUCKET }}
      VIDEORC_RELEASE_UPLOAD_S3_REGION: ${{ vars.VIDEORC_RELEASE_UPLOAD_S3_REGION }}
      VIDEORC_RELEASE_UPLOAD_S3_ENDPOINT_URL: ${{ vars.VIDEORC_RELEASE_UPLOAD_S3_ENDPOINT_URL }}
      VIDEORC_RELEASE_UPLOAD_S3_FORCE_PATH_STYLE: 'true'
      VIDEORC_DOWNLOAD_STORAGE_PRIMARY: ${{ vars.VIDEORC_DOWNLOAD_STORAGE_PRIMARY }}
      VIDEORC_RELEASE_UPLOAD_HETZNER_S3_BUCKET: ${{ vars.VIDEORC_RELEASE_UPLOAD_HETZNER_S3_BUCKET }}
      VIDEORC_RELEASE_UPLOAD_HETZNER_S3_REGION: ${{ vars.VIDEORC_RELEASE_UPLOAD_HETZNER_S3_REGION }}
      VIDEORC_RELEASE_UPLOAD_HETZNER_S3_ENDPOINT_URL: ${{ vars.VIDEORC_RELEASE_UPLOAD_HETZNER_S3_ENDPOINT_URL }}
      VIDEORC_RELEASE_UPLOAD_HETZNER_S3_FORCE_PATH_STYLE: 'true'
      VIDEORC_RELEASE_UPLOAD_NEON_S3_BUCKET: ${{ vars.VIDEORC_RELEASE_UPLOAD_NEON_S3_BUCKET }}
      VIDEORC_RELEASE_UPLOAD_NEON_S3_REGION: ${{ vars.VIDEORC_RELEASE_UPLOAD_NEON_S3_REGION }}
      VIDEORC_RELEASE_UPLOAD_NEON_S3_ENDPOINT_URL: ${{ vars.VIDEORC_RELEASE_UPLOAD_NEON_S3_ENDPOINT_URL }}
      VIDEORC_RELEASE_UPLOAD_NEON_S3_FORCE_PATH_STYLE: 'true'
      VIDEORC_RELEASE_CONTROL_DATA_S3_BUCKET: ${{ vars.VIDEORC_RELEASE_CONTROL_DATA_S3_BUCKET }}
      VIDEORC_RELEASE_CONTROL_DATA_S3_REGION: ${{ vars.VIDEORC_RELEASE_CONTROL_DATA_S3_REGION }}
      VIDEORC_RELEASE_CONTROL_DATA_S3_ENDPOINT_URL: ${{ vars.VIDEORC_RELEASE_CONTROL_DATA_S3_ENDPOINT_URL }}
      VIDEORC_RELEASE_CONTROL_DATA_S3_FORCE_PATH_STYLE: ${{ vars.VIDEORC_RELEASE_CONTROL_DATA_S3_FORCE_PATH_STYLE }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.6.0
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 11.28.4
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node scripts/release-sync-controlled.mjs prepare
        env:
          GH_TOKEN: ${{ github.token }}
          VIDEORC_RELEASE_CONTROL_S3_ACCESS_KEY_ID: ${{ secrets.VIDEORC_RELEASE_CONTROL_FINALIZE_S3_ACCESS_KEY_ID }}
          VIDEORC_RELEASE_CONTROL_S3_SECRET_ACCESS_KEY: ${{ secrets.VIDEORC_RELEASE_CONTROL_FINALIZE_S3_SECRET_ACCESS_KEY }}
          VIDEORC_RELEASE_UPLOAD_S3_ACCESS_KEY_ID: ${{ secrets.VIDEORC_MACOS_RELEASE_WRITE_S3_ACCESS_KEY_ID }}
          VIDEORC_RELEASE_UPLOAD_S3_SECRET_ACCESS_KEY: ${{ secrets.VIDEORC_MACOS_RELEASE_WRITE_S3_SECRET_ACCESS_KEY }}
          VIDEORC_RELEASE_UPLOAD_HETZNER_S3_ACCESS_KEY_ID: ${{ secrets.VIDEORC_RELEASE_UPLOAD_HETZNER_S3_ACCESS_KEY_ID }}
          VIDEORC_RELEASE_UPLOAD_HETZNER_S3_SECRET_ACCESS_KEY: ${{ secrets.VIDEORC_RELEASE_UPLOAD_HETZNER_S3_SECRET_ACCESS_KEY }}
          VIDEORC_RELEASE_UPLOAD_NEON_S3_ACCESS_KEY_ID: ${{ secrets.VIDEORC_RELEASE_UPLOAD_NEON_S3_ACCESS_KEY_ID }}
          VIDEORC_RELEASE_UPLOAD_NEON_S3_SECRET_ACCESS_KEY: ${{ secrets.VIDEORC_RELEASE_UPLOAD_NEON_S3_SECRET_ACCESS_KEY }}
          VIDEORC_RELEASE_CONTROL_DATA_S3_ACCESS_KEY_ID: ${{ secrets.VIDEORC_RELEASE_CONTROL_DATA_FINALIZE_S3_ACCESS_KEY_ID }}
          VIDEORC_RELEASE_CONTROL_DATA_S3_SECRET_ACCESS_KEY: ${{ secrets.VIDEORC_RELEASE_CONTROL_DATA_FINALIZE_S3_SECRET_ACCESS_KEY }}
    if: ${{ github.ref == 'refs/heads/main' && vars.VIDEORC_RELEASE_CONTROLLER_ENABLED == 'true' }}
  reconcile:
    name: Reconcile immutable history and current pointers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-publication
    permissions:
      contents: read
      actions: write
    concurrency:
      group: release-publication
      cancel-in-progress: false
    env:
      VIDEORC_RELEASE_CONTROLLER_ENABLED: ${{ vars.VIDEORC_RELEASE_CONTROLLER_ENABLED }}
      VIDEORC_RELEASE_CONTROL_PREFIX: ${{ vars.VIDEORC_RELEASE_CONTROL_PREFIX }}
      VIDEORC_RELEASE_CONTROL_S3_BUCKET: ${{ vars.VIDEORC_RELEASE_CONTROL_S3_BUCKET }}
      VIDEORC_RELEASE_CONTROL_S3_REGION: ${{ vars.VIDEORC_RELEASE_CONTROL_S3_REGION }}
      VIDEORC_RELEASE_CONTROL_S3_ENDPOINT_URL: ${{ vars.VIDEORC_RELEASE_CONTROL_S3_ENDPOINT_URL }}
      VIDEORC_RELEASE_CONTROL_S3_FORCE_PATH_STYLE: ${{ vars.VIDEORC_RELEASE_CONTROL_S3_FORCE_PATH_STYLE }}
      VIDEORC_RELEASE_UPLOAD_S3_BUCKET: ${{ vars.VIDEORC_RELEASE_UPLOAD_S3_BUCKET }}
      VIDEORC_RELEASE_UPLOAD_S3_REGION: ${{ vars.VIDEORC_RELEASE_UPLOAD_S3_REGION }}
      VIDEORC_RELEASE_UPLOAD_S3_ENDPOINT_URL: ${{ vars.VIDEORC_RELEASE_UPLOAD_S3_ENDPOINT_URL }}
      VIDEORC_RELEASE_UPLOAD_S3_FORCE_PATH_STYLE: 'true'
      VIDEORC_DOWNLOAD_STORAGE_PRIMARY: ${{ vars.VIDEORC_DOWNLOAD_STORAGE_PRIMARY }}
      VIDEORC_RELEASE_UPLOAD_HETZNER_S3_BUCKET: ${{ vars.VIDEORC_RELEASE_UPLOAD_HETZNER_S3_BUCKET }}
      VIDEORC_RELEASE_UPLOAD_HETZNER_S3_REGION: ${{ vars.VIDEORC_RELEASE_UPLOAD_HETZNER_S3_REGION }}
      VIDEORC_RELEASE_UPLOAD_HETZNER_S3_ENDPOINT_URL: ${{ vars.VIDEORC_RELEASE_UPLOAD_HETZNER_S3_ENDPOINT_URL }}
      VIDEORC_RELEASE_UPLOAD_HETZNER_S3_FORCE_PATH_STYLE: 'true'
      VIDEORC_RELEASE_UPLOAD_NEON_S3_BUCKET: ${{ vars.VIDEORC_RELEASE_UPLOAD_NEON_S3_BUCKET }}
      VIDEORC_RELEASE_UPLOAD_NEON_S3_REGION: ${{ vars.VIDEORC_RELEASE_UPLOAD_NEON_S3_REGION }}
      VIDEORC_RELEASE_UPLOAD_NEON_S3_ENDPOINT_URL: ${{ vars.VIDEORC_RELEASE_UPLOAD_NEON_S3_ENDPOINT_URL }}
      VIDEORC_RELEASE_UPLOAD_NEON_S3_FORCE_PATH_STYLE: 'true'
      VIDEORC_RELEASE_CONTROL_DATA_S3_BUCKET: ${{ vars.VIDEORC_RELEASE_CONTROL_DATA_S3_BUCKET }}
      VIDEORC_RELEASE_CONTROL_DATA_S3_REGION: ${{ vars.VIDEORC_RELEASE_CONTROL_DATA_S3_REGION }}
      VIDEORC_RELEASE_CONTROL_DATA_S3_ENDPOINT_URL: ${{ vars.VIDEORC_RELEASE_CONTROL_DATA_S3_ENDPOINT_URL }}
      VIDEORC_RELEASE_CONTROL_DATA_S3_FORCE_PATH_STYLE: ${{ vars.VIDEORC_RELEASE_CONTROL_DATA_S3_FORCE_PATH_STYLE }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.6.0
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 11.28.4
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node scripts/release-sync-controlled.mjs pointers
        env:
          GH_TOKEN: ${{ github.token }}
          VIDEORC_RELEASE_CONTROL_S3_ACCESS_KEY_ID: ${{ secrets.VIDEORC_RELEASE_CONTROL_FINALIZE_S3_ACCESS_KEY_ID }}
          VIDEORC_RELEASE_CONTROL_S3_SECRET_ACCESS_KEY: ${{ secrets.VIDEORC_RELEASE_CONTROL_FINALIZE_S3_SECRET_ACCESS_KEY }}
          VIDEORC_RELEASE_UPLOAD_S3_ACCESS_KEY_ID: ${{ secrets.VIDEORC_MACOS_RELEASE_WRITE_S3_ACCESS_KEY_ID }}
          VIDEORC_RELEASE_UPLOAD_S3_SECRET_ACCESS_KEY: ${{ secrets.VIDEORC_MACOS_RELEASE_WRITE_S3_SECRET_ACCESS_KEY }}
          VIDEORC_RELEASE_UPLOAD_HETZNER_S3_ACCESS_KEY_ID: ${{ secrets.VIDEORC_RELEASE_UPLOAD_HETZNER_S3_ACCESS_KEY_ID }}
          VIDEORC_RELEASE_UPLOAD_HETZNER_S3_SECRET_ACCESS_KEY: ${{ secrets.VIDEORC_RELEASE_UPLOAD_HETZNER_S3_SECRET_ACCESS_KEY }}
          VIDEORC_RELEASE_UPLOAD_NEON_S3_ACCESS_KEY_ID: ${{ secrets.VIDEORC_RELEASE_UPLOAD_NEON_S3_ACCESS_KEY_ID }}
          VIDEORC_RELEASE_UPLOAD_NEON_S3_SECRET_ACCESS_KEY: ${{ secrets.VIDEORC_RELEASE_UPLOAD_NEON_S3_SECRET_ACCESS_KEY }}
          VIDEORC_RELEASE_CONTROL_DATA_S3_ACCESS_KEY_ID: ${{ secrets.VIDEORC_RELEASE_CONTROL_DATA_FINALIZE_S3_ACCESS_KEY_ID }}
          VIDEORC_RELEASE_CONTROL_DATA_S3_SECRET_ACCESS_KEY: ${{ secrets.VIDEORC_RELEASE_CONTROL_DATA_FINALIZE_S3_SECRET_ACCESS_KEY }}
    if: ${{ github.ref == 'refs/heads/main' && vars.VIDEORC_RELEASE_CONTROLLER_ENABLED == 'true' }}
    needs: prepare
