name: Change scope

# Called by CI, Windows, and Linux. Classifies the push or PR diff so those
# workflows can skip heavy jobs for version-only release PRs and docs-record
# PRs, and the Rust jobs for PRs that change only desktop app source no Rust
# code reads (app-ts, pull requests only: plan 242 S15). Fail closed: an
# unreadable or empty diff is treated as code.
# This workflow does not compile, test, or publish anything.

on:
  workflow_call:
    outputs:
      kind:
        description: code, version-release, docs-record, docs, js-test, or app-ts
        value: ${{ jobs.scope.outputs.kind }}
      windows_heavy:
        description: Whether Windows source gates and the installer must run
        value: ${{ jobs.scope.outputs.windows_heavy }}
      linux_heavy:
        description: Whether Linux FFmpeg policy plus Rust compile/test must run
        value: ${{ jobs.scope.outputs.linux_heavy }}
      macos_rust:
        description: Whether the hosted macOS Rust job must run
        value: ${{ jobs.scope.outputs.macos_rust }}
      js:
        description: Whether the JS format/lint/test job must run
        value: ${{ jobs.scope.outputs.js }}
      windows_incident_tooling:
        description: Whether a pull request changes the Windows incident diagnostics tooling
        value: ${{ jobs.scope.outputs.windows_incident_tooling }}
      macos_sentinel:
        description: Whether the macOS app sentinel (boots the dev app) must run
        value: ${{ jobs.scope.outputs.macos_sentinel }}
      windows_js:
        description: Whether the Windows JS gates (desktop tests on Windows) must run
        value: ${{ jobs.scope.outputs.windows_js }}
      windows_installer:
        description: Whether the Windows installer and its packaged-app smokes must run
        value: ${{ jobs.scope.outputs.windows_installer }}
      electron_tests:
        description: Whether this diff requires the Electron build and desktop/Node suites
        value: ${{ jobs.scope.outputs.electron_tests }}

concurrency:
  group: ci-change-scope-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Classify change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kind: ${{ steps.classify.outputs.kind }}
      windows_heavy: ${{ steps.classify.outputs.windows_heavy }}
      linux_heavy: ${{ steps.classify.outputs.linux_heavy }}
      macos_rust: ${{ steps.classify.outputs.macos_rust }}
      js: ${{ steps.classify.outputs.js }}
      windows_incident_tooling: ${{ steps.classify.outputs.windows_incident_tooling }}
      macos_sentinel: ${{ steps.classify.outputs.macos_sentinel }}
      windows_js: ${{ steps.classify.outputs.windows_js }}
      windows_installer: ${{ steps.classify.outputs.windows_installer }}
      electron_tests: ${{ steps.electron.outputs.required }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          # Plan 242 S18: full history for the diff, blobs on demand. The diff
          # needs only trees; package.json is fetched when a diff touches it.
          filter: blob:none
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.6.0'

      - name: Classify change scope
        id: classify
        run: node scripts/ci-change-scope.mjs
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.sha }}

      - name: Scope Electron suites
        id: electron
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.sha }}
        # Keep the workflow running so required check names resolve. Unknown,
        # empty and unreadable diffs retain every gate; pushes retain them too.
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process'
          import { appendFileSync } from 'node:fs'
          let required = true
          if (process.env.GITHUB_EVENT_NAME === 'pull_request') {
            const prefixes = ['apps/videorc/', 'crates/videorc-kit/', 'crates/videorc-app-core/', 'docs/', 'plans/']
            try {
              const base = process.env.CI_BASE_SHA
              const head = process.env.CI_HEAD_SHA
              if (!/^[0-9a-f]{40}$/.test(base ?? '') || !/^[0-9a-f]{40}$/.test(head ?? '')) throw new Error('Missing diff SHA')
              const files = execFileSync('git', ['diff', '--name-only', '--no-renames', '-z', `${base}...${head}`], { encoding: 'utf8' }).split('\0').filter(Boolean)
              required = files.length === 0 || !files.every(file => prefixes.some(prefix => file.startsWith(prefix)))
            } catch {
              required = true
            }
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `required=${required}\n`)
          console.log(`Electron suites required: ${required}`)
          JS
