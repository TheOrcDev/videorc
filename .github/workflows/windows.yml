name: Windows

# Windows counterparts of the fast CI gates plus a downloadable installer.
# The repo is public, so windows-latest minutes are free. Every failure the
# first external Windows tester hit (path separators in desktop tests, the
# stale named-pipe recreate, pnpm spawn semantics, dev-app startup) lived in
# code that had only ever *compiled* for Windows (pnpm check:windows) and
# never executed there — these jobs close that gap before a human pulls.
# Real capture/encode/preview quality still needs the physical Windows box.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Change scope
    uses: ./.github/workflows/ci-change-scope.yml

  gates:
    needs: scope
    if: ${{ needs.scope.result == 'success' && needs.scope.outputs.windows_heavy == 'true' }}
    uses: ./.github/workflows/release-windows-gates.yml
    with:
      source_sha: ${{ github.sha }}

  gates-skip:
    name: gates / Windows release source gates
    needs: scope
    if: ${{ needs.scope.result == 'success' && needs.scope.outputs.windows_heavy != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip heavy Windows source gates for an allow-listed docs or version-only change
        run: |
          echo "Skipped Windows release source gates for a ${{ needs.scope.outputs.kind }} change set."
          echo "The Windows alpha release workflow still runs its own protected-main source gates."
          echo "Ordinary code PRs still run the full reusable Windows source-gate recipe."

  installer:
    name: Windows installer artifact
    needs: scope
    if: ${{ needs.scope.result == 'success' && needs.scope.outputs.windows_heavy == 'true' }}
    runs-on: windows-latest
    # Recent green-step runs: 19-27 min (+~5 min for the separate recovery
    # test package). 45 keeps margin without an hour-long hang.
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache capture FFmpeg sources
        # The capture worker compiles from the official tarball. A single
        # ffmpeg.org timeout used to fail this whole job; the SHA-256 pin is
        # still checked after restore, so a stale cache cannot ship.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            vendor/ffmpeg/_src
            vendor/ffmpeg/_build/windows-download.zip
          key: windows-ffmpeg-capture-src-${{ hashFiles('vendor/ffmpeg/windows-capture-pin.json', 'vendor/ffmpeg/windows-pin.json') }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.6.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up minimal Windows capture-worker toolchain
        id: capture-msys2
        # Pinned setup-msys2 v2; output encoder stays the separately pinned binary.
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: UCRT64
          update: true
          install: >-
            make diffutils patch curl tar xz
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-nasm

      - name: Build Windows installer
        # Backend release build + pinned LGPL ffmpeg fetch + fail-closed
        # preflight (runs the ffmpeg rtmps/tls/h264_mf capability probe on a
        # real Windows host) + electron-builder dir/nsis targets. Unsigned:
        # testers will see a SmartScreen warning until signing lands.
        env:
          VIDEORC_MSYS2_ROOT: ${{ steps.capture-msys2.outputs.msys2-location }}
        run: pnpm dist:desktop:windows

      - name: Verify packaged capture-worker protocol, normalization and source manifests
        run: node scripts/ffmpeg-capture-windows.mjs apps/desktop/release/win-unpacked/resources/ffmpeg

      - name: Verify bundled FFmpeg live microphone controls
        run: pnpm probe:live-audio-controls
        env:
          VIDEORC_SMOKE_FFMPEG_PATH: ${{ github.workspace }}\apps\desktop\release\win-unpacked\resources\ffmpeg\bin\ffmpeg.exe

      - name: Verify packaged 1080p recording duration and A/V
        run: pnpm smoke:packaged:bundled
        env:
          VIDEORC_PACKAGED_APP_EXECUTABLE: apps/desktop/release/win-unpacked/Videorc.exe
          VIDEORC_SMOKE_OUTPUT_DIR: ${{ runner.temp }}/videorc-windows-recording-smoke
          VIDEORC_SMOKE_RECORDING_MS: '5000'
          VIDEORC_SMOKE_TIMEOUT_MS: '120000'
          VIDEORC_SMOKE_VIDEO_WIDTH: '1920'
          VIDEORC_SMOKE_VIDEO_HEIGHT: '1080'
          VIDEORC_SMOKE_VIDEO_FPS: '30'
          VIDEORC_SMOKE_VIDEO_BITRATE_KBPS: '6000'

      - name: Verify native DXGI/GDI ScreenOnly recording and BMP preview
        # The hosted Microsoft Basic Render Driver can briefly lose cadence
        # under shared-runner preemption. Retry a fresh packaged-app run so a
        # one-off 3-4% cadence dip does not make the installer gate flaky;
        # persistent capture/quality failures still fail after all attempts.
        run: |
          $attempts = 3
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            $env:VIDEORC_SMOKE_OUTPUT_DIR = Join-Path $env:RUNNER_TEMP "videorc-windows-native-screen-smoke-attempt-$attempt"
            Write-Host "Windows native screen smoke attempt $attempt/$attempts"
            pnpm smoke:windows-native-screen
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            if ($attempt -eq $attempts) {
              exit $LASTEXITCODE
            }
            Write-Host "Native screen smoke attempt $attempt failed; retrying with a fresh app/output directory."
          }
        env:
          VIDEORC_PERF_APP_EXECUTABLE: apps/desktop/release/win-unpacked/Videorc.exe
          VIDEORC_SMOKE_OUTPUT_DIR: ${{ runner.temp }}/videorc-windows-native-screen-smoke
          VIDEORC_SMOKE_FFMPEG_PATH: ${{ github.workspace }}\apps\desktop\release\win-unpacked\resources\ffmpeg\bin\ffmpeg.exe
          VIDEORC_SMOKE_FFPROBE_PATH: ${{ github.workspace }}\apps\desktop\release\win-unpacked\resources\ffmpeg\bin\ffprobe.exe
          VIDEORC_SMOKE_TIMEOUT_MS: '180000'
          VIDEORC_WINDOWS_NATIVE_SCREEN_RECORDING_MS: '6000'
          VIDEORC_SMOKE_VIDEO_WIDTH: '1280'
          VIDEORC_SMOKE_VIDEO_HEIGHT: '720'
          VIDEORC_SMOKE_VIDEO_FPS: '30'
          VIDEORC_SMOKE_VIDEO_BITRATE_KBPS: '4000'

      - name: Verify Windows preview stays live while recording
        run: pnpm smoke:recording-native-preview
        env:
          VIDEORC_PERF_APP_EXECUTABLE: apps/desktop/release/win-unpacked/Videorc.exe
          VIDEORC_SMOKE_OUTPUT_DIR: ${{ runner.temp }}/videorc-windows-preview-recording-smoke
          VIDEORC_SMOKE_FFMPEG_PATH: ${{ github.workspace }}\apps\desktop\release\win-unpacked\resources\ffmpeg\bin\ffmpeg.exe
          VIDEORC_SMOKE_FFPROBE_PATH: ${{ github.workspace }}\apps\desktop\release\win-unpacked\resources\ffmpeg\bin\ffprobe.exe
          VIDEORC_SMOKE_TIMEOUT_MS: '180000'
          # Longer warmup lets the GPU-less runner's OpenH264 software encoder reach
          # steady state before measuring, and a longer measurement window keeps p95
          # from being dominated by a single stall spike. Recording must comfortably
          # exceed warmup + measurement, which run concurrently inside it.
          VIDEORC_NATIVE_PREVIEW_RECORDING_MS: '12000'
          VIDEORC_NATIVE_PREVIEW_WARMUP_MS: '6000'
          VIDEORC_NATIVE_PREVIEW_MEASUREMENT_MS: '5000'
          VIDEORC_EXPECT_NATIVE_METAL_PREVIEW: '0'
          VIDEORC_NATIVE_PREVIEW_EXERCISE_PROOF_POLLING: '1'
          # Hosted Windows uses the contained Electron proof surface with 125ms
          # polling, not the production native CAMetalLayer latency contract.
          VIDEORC_NATIVE_PREVIEW_MAX_INPUT_TO_PRESENT_P95_MS: '350'
          VIDEORC_NATIVE_PREVIEW_MAX_INPUT_TO_PRESENT_P99_MS: '500'
          # Typical source-to-present p95 on this runner is ~180ms, but shared CI
          # hosts occasionally stall (noisy-neighbor CPU preemption) and spike a
          # single measurement window to 380-510ms. Re-measure on a fresh launch up
          # to 4 times; a real regression still fails because it breaches every
          # attempt. Keeps the 350ms gate strict instead of relaxing it.
          VIDEORC_NATIVE_PREVIEW_MEASUREMENT_ATTEMPTS: '4'
          VIDEORC_ENCODER_BRIDGE_VIDEO_OUTPUT: raw-yuv420p

      - name: Verify the main window recovers from a dead renderer and never strands Mica
        # Plan 082: a crashed renderer used to leave an empty window for ever.
        # Since #913 the production package refuses CDP, so this builds a
        # separate CDP-enabled test package and probes that one; the
        # installer under test is hash-checked to stay untouched.
        timeout-minutes: 20
        run: pnpm smoke:windows-main-window-recovery
        env:
          VIDEORC_PERF_APP_EXECUTABLE: apps/desktop/release/win-unpacked/Videorc.exe
          VIDEORC_SMOKE_OUTPUT_DIR: ${{ runner.temp }}/videorc-windows-main-window-recovery

      - name: Upload main-window recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-main-window-recovery
          path: |
            ${{ runner.temp }}/videorc-windows-main-window-recovery/**/*.png
            ${{ runner.temp }}/videorc-windows-main-window-recovery/**/*.json
            ${{ runner.temp }}/videorc-windows-main-window-recovery/**/*.log
            !${{ runner.temp }}/videorc-windows-main-window-recovery/*-userdata/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: videorc-windows-installer
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error
          retention-days: 30

  installer-skip:
    name: Windows installer artifact
    needs: scope
    if: ${{ needs.scope.result == 'success' && needs.scope.outputs.windows_heavy != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip Windows installer artifact for an allow-listed docs or version-only change
        run: |
          echo "Skipped the Windows installer artifact for a ${{ needs.scope.outputs.kind }} change set."
          echo "Ordinary code PRs still build the unsigned installer on windows-latest."

  incident:
    name: Windows startup incident diagnostics
    needs: scope
    if: ${{ needs.scope.result == 'success' && needs.scope.outputs.windows_heavy == 'true' }}
    runs-on: windows-latest
    # Recent runs: 44-56 min. Capped near an hour; diagnostics only.
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.6.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: ffmpeg-fetch
        run: pnpm ffmpeg:fetch:windows
      - name: Compare OpenH264 frame skipping on identical finite inputs
        shell: pwsh
        run: pnpm probe:windows-openh264 -- --output "$env:RUNNER_TEMP/openh264-comparison" --eof-stability-passes 25
      - name: Retain standalone OpenH264 comparison before backend compilation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-openh264-comparison
          path: ${{ runner.temp }}/openh264-comparison
          if-no-files-found: warn
          retention-days: 14
      - id: backend-build
        if: ${{ !cancelled() && steps.ffmpeg-fetch.outcome == 'success' }}
        run: cargo build -p videorc-backend
      - name: Prepare standalone diagnostic backend artifact
        if: ${{ !cancelled() && steps.backend-build.outcome == 'success' }}
        shell: pwsh
        run: |
          $diagnosticDirectory = Join-Path $env:RUNNER_TEMP 'windows-diagnostic-backend'
          New-Item -ItemType Directory -Path $diagnosticDirectory -Force | Out-Null
          $binary = Join-Path $diagnosticDirectory 'videorc-backend.exe'
          Copy-Item 'target/debug/videorc-backend.exe' $binary
          @{
            schemaVersion = 1
            kind = 'videorc.windows-diagnostic-backend'
            qualification = 'debug diagnostic binary; not an installer or release candidate'
            sourceCommit = $env:GITHUB_SHA
            sourceCommitProvenance = 'workflow checkout used for this cargo build; not inferred from a tester checkout'
            workflowRunId = $env:GITHUB_RUN_ID
            backendSha256 = (Get-FileHash -Algorithm SHA256 $binary).Hash.ToLowerInvariant()
          } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $diagnosticDirectory 'identity.json')
      - name: Upload standalone diagnostic backend
        if: ${{ !cancelled() && steps.backend-build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: videorc-windows-diagnostic-backend
          path: ${{ runner.temp }}/windows-diagnostic-backend
          if-no-files-found: error
          retention-days: 14
      - name: Bounded Media Foundation diagnostic matrix
        if: ${{ !cancelled() && steps.backend-build.outcome == 'success' }}
        shell: pwsh
        run: |
          pnpm smoke:windows-mf-probe -- --output "$env:RUNNER_TEMP/mf-probe"
          exit $LASTEXITCODE
        env:
          VIDEORC_DATABASE_PATH: ${{ runner.temp }}/mf-probe-state/videorc.sqlite3

      - name: Retain Media Foundation measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-mf-probe
          path: ${{ runner.temp }}/mf-probe
          if-no-files-found: warn
          retention-days: 14

      - name: Controlled-audio incident matrix (three repetitions per case)
        if: ${{ !cancelled() && steps.backend-build.outcome == 'success' && steps.ffmpeg-fetch.outcome == 'success' }}
        shell: pwsh
        run: pnpm smoke:windows-stream-performance -- --incident --audio controlled --output "$env:RUNNER_TEMP/incident"
      - name: Retain every incident attempt including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-startup-incident
          path: ${{ runner.temp }}/incident
          if-no-files-found: warn
          retention-days: 14

      - name: Independent FFmpeg-tone incident control (three repetitions per case)
        if: ${{ !cancelled() && steps.backend-build.outcome == 'success' && steps.ffmpeg-fetch.outcome == 'success' }}
        shell: pwsh
        run: pnpm smoke:windows-stream-performance -- --incident --audio ffmpeg-control --output "$env:RUNNER_TEMP/incident-ffmpeg-control"
      - name: Retain independent FFmpeg-tone control including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-startup-incident-ffmpeg-control
          path: ${{ runner.temp }}/incident-ffmpeg-control
          if-no-files-found: warn
          retention-days: 14

  incident-skip:
    name: Windows startup incident diagnostics
    needs: scope
    if: ${{ needs.scope.result == 'success' && needs.scope.outputs.windows_heavy != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip known-noisy Windows incident diagnostics for an allow-listed change
        run: |
          echo "Skipped Windows startup incident diagnostics for a ${{ needs.scope.outputs.kind }} change set."
          echo "This job is already ignored by the release routine on ordinary code PRs."
