name: Lab candidate macOS

# Plan 178 U5. Builds a Developer-ID-signed Videorc.app from any branch, sha
# or same-repo PR head for the live lab machine. It is NOT a release: no
# notarization, no upload to any storage origin, and no release manifest,
# release notes or updater pointer. The lab machine pulls the artifact with
# `pnpm live:install --build candidate:<run-id|sha>`, which checks the Team ID
# before it installs. Developer ID keeps the designated requirement stable, so
# the lab's TCC grants survive each new candidate.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, commit sha or same-repo PR head to build'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Its own group: a lab candidate never queues behind or blocks a release.
  group: lab-candidate
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  candidate:
    name: Build signed lab candidate
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Check out requested ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          # All branches, so the next step can prove the commit lives on one.
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse commits that are not on a branch of this repository
        # Signing secrets reach this job. Fork PR heads exist only under
        # refs/pull/*, so a commit no repository branch contains is refused.
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse 'HEAD^{commit}')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          if [ -z "$(git branch -r --contains "$sha")" ]; then
            echo "::error::$sha is not on any branch of $GITHUB_REPOSITORY. Push it to a branch first (fork PR heads are refused)."
            exit 1
          fi
          short="${sha:0:7}"
          # A semver prerelease identifier may not be all digits with a leading zero.
          suffix="$short"
          if [[ "$suffix" =~ ^[0-9]+$ ]]; then
            suffix="g$short"
          fi
          base="$(/usr/bin/plutil -extract version raw -o - apps/desktop/package.json)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "version=${base}-lab.${suffix}" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.0.9
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.6.0'
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the signing certificate is configured
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ]; then
            echo '::error::CSC_LINK and CSC_KEY_PASSWORD are required. An unsigned or ad-hoc lab candidate would lose its TCC grants.'
            exit 1
          fi

      - name: Build backend, native preview and FFmpeg
        run: |
          pnpm package:backend:macos
          pnpm ffmpeg:build:macos
          pnpm package:preflight:macos
        env:
          VIDEORC_BUNDLED_TWITCH_CLIENT_ID: ${{ secrets.VIDEORC_BUNDLED_TWITCH_CLIENT_ID }}
          VIDEORC_BUNDLED_KICK_CLIENT_ID: ${{ secrets.VIDEORC_BUNDLED_KICK_CLIENT_ID }}
          VIDEORC_BUNDLED_KICK_CLIENT_SECRET: ${{ secrets.VIDEORC_BUNDLED_KICK_CLIENT_SECRET }}
          VIDEORC_BUNDLED_X_OAUTH1_CONSUMER_KEY: ${{ secrets.VIDEORC_BUNDLED_X_OAUTH1_CONSUMER_KEY }}
          VIDEORC_BUNDLED_X_OAUTH1_CONSUMER_SECRET: ${{ secrets.VIDEORC_BUNDLED_X_OAUTH1_CONSUMER_SECRET }}
          VIDEORC_BUNDLED_YOUTUBE_CLIENT_ID: ${{ secrets.VIDEORC_BUNDLED_YOUTUBE_CLIENT_ID }}
          VIDEORC_BUNDLED_YOUTUBE_CLIENT_SECRET: ${{ secrets.VIDEORC_BUNDLED_YOUTUBE_CLIENT_SECRET }}

      - name: Build Developer-ID-signed app (not notarized)
        working-directory: apps/desktop
        run: |
          pnpm build
          pnpm exec electron-builder --mac zip --publish never \
            --config.mac.notarize=false \
            --config.extraMetadata.version="$LAB_VERSION"
        env:
          LAB_VERSION: ${{ steps.source.outputs.version }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'

      - name: Verify signature and write the sidecar
        shell: bash
        env:
          LAB_SHA: ${{ steps.source.outputs.sha }}
          LAB_SHORT: ${{ steps.source.outputs.short }}
          LAB_VERSION: ${{ steps.source.outputs.version }}
          LAB_REF: ${{ inputs.ref }}
          LAB_TEAM_ID: C2PA37RB58
        run: |
          set -euo pipefail
          app='apps/desktop/release/mac-arm64/Videorc.app'
          codesign --verify --deep --strict --verbose=2 "$app"
          details="$(codesign -dv --verbose=4 "$app" 2>&1)"
          if grep -q '^Signature=adhoc' <<<"$details"; then
            echo '::error::The app is ad-hoc signed. The lab refuses it (TCC would drop the grants).'
            exit 1
          fi
          grep -qx "TeamIdentifier=$LAB_TEAM_ID" <<<"$details"
          plist_version="$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$app/Contents/Info.plist")"
          test "$plist_version" = "$LAB_VERSION"
          zip_path="$(ls apps/desktop/release/*-mac-arm64.zip)"
          test "$(wc -l <<<"$zip_path")" -eq 1
          mkdir -p lab-candidate
          mv "$zip_path" lab-candidate/
          zip_name="$(basename "$zip_path")"
          zip_sha256="$(shasum -a 256 "lab-candidate/$zip_name" | cut -d' ' -f1)"
          node -e '
            const { writeFileSync } = require("node:fs")
            const env = process.env
            const sidecar = {
              schema: 1,
              sha: env.LAB_SHA,
              ref: env.LAB_REF,
              version: env.LAB_VERSION,
              builtAt: new Date().toISOString(),
              teamId: env.LAB_TEAM_ID,
              runId: env.GITHUB_RUN_ID,
              runAttempt: env.GITHUB_RUN_ATTEMPT,
              zip: { name: process.argv[1], sha256: process.argv[2] }
            }
            writeFileSync("lab-candidate/lab-candidate.json", JSON.stringify(sidecar, null, 2) + "\n")
          ' "$zip_name" "$zip_sha256"
          echo "artifact=lab-candidate-$LAB_SHORT" >> "$GITHUB_ENV"
          {
            echo "### Lab candidate $LAB_VERSION"
            echo
            echo "Install on the lab machine: \`pnpm live:install --build candidate:$GITHUB_RUN_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lab candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.artifact }}
          path: lab-candidate/
          if-no-files-found: error
          retention-days: 7
