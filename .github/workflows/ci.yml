name: CI

# Fast correctness gates on every push to main and every PR. The release
# workflow (release-macos.yml) runs the full smoke suite at tag time; those
# smokes need a display + Screen Recording TCC and cannot run headless here, so
# CI covers the layers that CAN: Rust unit tests, clippy, fmt, the TS
# typecheck, and the Node logic tests. Device/preview/recording smokes stay in
# the release job and in local `pnpm smoke:local-gates`.

on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Change scope
    uses: ./.github/workflows/ci-change-scope.yml

  rust:
    name: Rust (test + clippy + fmt)
    needs: scope
    if: ${{ needs.scope.result == 'success' && needs.scope.outputs.macos_rust == 'true' }}
    runs-on: macos-15
    # Every run on main since plan 172 was cancelled at the 75-minute limit
    # while rustc was still compiling the backend *test* binary at the
    # workspace dev opt-level 2 (one ~24k-line main.rs, full debuginfo, on a
    # 3-core runner). The test/sentinel builds below compile the backend crate
    # itself at opt-level 0 with line tables only (dependencies keep opt 2),
    # which is a correctness gate, not a perf gate. 60 min is a hard ceiling.
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: CI-only fast backend build profile
        # Written to CARGO_HOME (not the repo) so it also covers the dev app's
        # own `cargo run` in the sentinel. Release builds are untouched.
        run: |
          mkdir -p "$HOME/.cargo"
          cat >> "$HOME/.cargo/config.toml" <<'TOML'
          [profile.dev]
          debug = "line-tables-only"
          [profile.dev.package.videorc-backend]
          opt-level = 0
          TOML
          cat "$HOME/.cargo/config.toml"

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          # The job never finished, so the cache was never saved and every run
          # rebuilt every dependency cold. Save the deps even on failure.
          cache-on-failure: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.6.0'
          cache: pnpm

      - name: Install cargo-audit
        # Fetch the prebuilt binary from GitHub releases instead of building it
        # from source. `cargo install cargo-audit --locked` compiles the whole
        # tool on every cache miss (minutes); the release binary lands in
        # seconds and does not depend on the crates.io registry being reachable.
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Rust advisory audit
        # audit-rust.mjs fetches the RustSec advisory DB with system Git and
        # runs `cargo audit --no-fetch`, so the audit does not depend on
        # cargo-audit's own network fetch (which can be blocked on restricted
        # runners). See scripts/audit-rust.mjs.
        run: node scripts/audit-rust.mjs

      - name: Format check
        run: cargo fmt --check --all

      - name: Clippy
        run: cargo clippy -p videorc-backend -- -D warnings

      - name: Compile tests
        # Split from the run so a slow compile and a hung test are told apart.
        timeout-minutes: 35
        run: cargo test -p videorc-backend --no-run

      - name: Test
        # ffmpeg-spawning tests are #[ignore]d, so the default run needs no
        # ffmpeg binary and no capture devices.
        timeout-minutes: 15
        run: cargo test -p videorc-backend

      - name: Build backend for process/memory sentinel
        # The sentinel launches the dev app through `cargo run`. Build the
        # exact binary first so its 120-second readiness budget measures app
        # startup rather than a cold Rust binary link on the macOS runner.
        timeout-minutes: 15
        run: cargo build -p videorc-backend --bin videorc-backend

      - name: Install dependencies for process/memory sentinel
        run: pnpm install --frozen-lockfile

      - name: Short no-device process/memory sentinel
        run: pnpm smoke:process-memory:sentinel

      - name: Upload process/memory sentinel report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: process-memory-sentinel-${{ github.run_id }}
          path: docs/acceptance/artifacts/performance/**/*.json
          # warn: when an earlier step fails there is no report, and an
          # upload error only hides the real failure. The sentinel step itself
          # still fails the job if it produces no report.
          if-no-files-found: warn
          retention-days: 30

  rust-skip:
    name: Rust (test + clippy + fmt)
    needs: scope
    if: ${{ needs.scope.result == 'success' && needs.scope.outputs.macos_rust != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip hosted macOS Rust gates for an allow-listed docs or version-only change
        run: |
          echo "Skipped the hosted macOS Rust job for a ${{ needs.scope.outputs.kind }} change set."
          echo "Ordinary code PRs still run the identical rust job on macos-15."

  js:
    name: JS (format + lint + tests)
    needs: scope
    if: ${{ needs.scope.result == 'success' && needs.scope.outputs.js == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.6.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: JS advisory audit
        run: pnpm audit:js

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build renderer for initial asset budget
        run: pnpm build

      - name: Initial renderer asset budget
        run: pnpm check:renderer-assets

      - name: Desktop tests
        run: pnpm --filter @videorc/desktop test

      - name: Node logic tests
        run: pnpm test:scripts

  js-skip:
    name: JS (format + lint + tests)
    needs: scope
    if: ${{ needs.scope.result == 'success' && needs.scope.outputs.js != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip JS gates for an allow-listed docs-record change
        run: |
          echo "Skipped the JS job for a ${{ needs.scope.outputs.kind }} change set."
          echo "Version-only release PRs still run JS. Ordinary code PRs still run the identical JS job."
