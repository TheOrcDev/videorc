name: CI

# Fast correctness gates on every push to main and every PR. The release
# workflow (release-macos.yml) runs the full smoke suite at tag time; those
# smokes need a display + Screen Recording TCC and cannot run headless here, so
# CI covers the layers that CAN: Rust unit tests, clippy, fmt, the TS
# typecheck, and the Node logic tests. Device/preview/recording smokes stay in
# the release job and in local `pnpm smoke:local-gates`.

on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Change scope
    uses: ./.github/workflows/ci-change-scope.yml

  rust:
    name: Rust (test + clippy + fmt)
    needs: scope
    if: ${{ needs.scope.result == 'success' && needs.scope.outputs.macos_rust == 'true' }}
    runs-on: macos-15
    # Every run on main since plan 172 was cancelled at the 75-minute limit
    # while rustc was still compiling the backend *test* binary at the
    # workspace dev opt-level 2 (one ~24k-line main.rs, full debuginfo, on a
    # 3-core runner). The test/sentinel builds below compile the backend crate
    # itself at opt-level 0 with line tables only (dependencies keep opt 2),
    # which is a correctness gate, not a perf gate. 70 min is a hard ceiling:
    # the steps before the test compile take ~13 min, the compile up to 45.
    timeout-minutes: 70
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: CI-only fast backend build profile
        # Written to CARGO_HOME (not the repo) so it also covers the dev app's
        # own `cargo run` in the sentinel. Release builds are untouched.
        run: |
          mkdir -p "$HOME/.cargo"
          cat >> "$HOME/.cargo/config.toml" <<'TOML'
          [profile.dev]
          debug = "line-tables-only"
          [profile.dev.package.videorc-backend]
          opt-level = 0
          TOML
          cat "$HOME/.cargo/config.toml"
          # At opt-level 0 the RPC dispatcher's unoptimized frame alone
          # outgrows the 2 MiB default thread stack, so every test that calls
          # it (and the sentinel backend's tokio workers) overflows. Give
          # those threads the 8 MiB the macOS backend thread already gets
          # (BACKEND_THREAD_STACK_BYTES); opt-level 2 builds need ~256 KiB.
          echo "RUST_MIN_STACK=8388608" >> "$GITHUB_ENV"

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          # The job never finished, so the cache was never saved and every run
          # rebuilt every dependency cold. Save the deps even on failure.
          cache-on-failure: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.6.0'
          cache: pnpm

      - name: Install cargo-audit
        # Fetch the prebuilt binary from GitHub releases instead of building it
        # from source. `cargo install cargo-audit --locked` compiles the whole
        # tool on every cache miss (minutes); the release binary lands in
        # seconds and does not depend on the crates.io registry being reachable.
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Rust advisory audit
        # audit-rust.mjs fetches the RustSec advisory DB with system Git and
        # runs `cargo audit --no-fetch`, so the audit does not depend on
        # cargo-audit's own network fetch (which can be blocked on restricted
        # runners). See scripts/audit-rust.mjs.
        run: node scripts/audit-rust.mjs

      - name: Format check
        run: cargo fmt --check --all

      - name: Clippy
        # --all-targets lints the test code too (#1070).
        run: cargo clippy -p videorc-backend --all-targets -- -D warnings

      - name: Clippy (release)
        # Release compiles out the debug_assertions-only smoke paths, so code
        # only they reach goes dead or unused there; the dev clippy above
        # cannot see it (#1070).
        run: cargo clippy --release -p videorc-backend -- -D warnings

      - name: Compile tests
        # Split from the run so a slow compile and a hung test are told apart.
        # It takes 23-30 min on most runs; on a slow runner (Clippy at 9 min
        # instead of 6) it ran past 35 twice on 2026-11-16 with a full cache
        # hit, while the same crate's Linux compile held at 9 min.
        timeout-minutes: 45
        run: cargo test -p videorc-backend --no-run

      - name: Install libsrt for the SRT Camera tests
        # Development builds load Homebrew's libsrt; without it the real
        # listener tests only print that they were skipped.
        run: brew install srt

      - name: Test
        # ffmpeg-spawning tests are #[ignore]d, so the default run needs no
        # ffmpeg binary and no capture devices.
        timeout-minutes: 15
        run: cargo test -p videorc-backend

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Videorc Camera extension build and Swift tests
        # Plan 214: without this the Swift extension first compiles inside a
        # release or lab-candidate build. --test builds the debug bundle,
        # checks its identifiers and entitlements, and runs the pure Swift
        # unit tests. No profile, no signing identity, no activation.
        timeout-minutes: 15
        run: pnpm test:camera-extension

  sentinel:
    # Plan 242 S14: the one CI check that boots the app runs beside the Rust
    # tests instead of after them, and runs for app-only pull requests too.
    name: macOS app sentinel
    needs: scope
    if: ${{ needs.scope.result == 'success' && needs.scope.outputs.macos_sentinel == 'true' }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: CI-only fast backend build profile
        # The same profile as the rust job, so the cache it saved matches.
        run: |
          mkdir -p "$HOME/.cargo"
          cat >> "$HOME/.cargo/config.toml" <<'TOML'
          [profile.dev]
          debug = "line-tables-only"
          [profile.dev.package.videorc-backend]
          opt-level = 0
          TOML
          cat "$HOME/.cargo/config.toml"
          echo "RUST_MIN_STACK=8388608" >> "$GITHUB_ENV"

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          # rust-cache keys a job's cache by its job id; `rust` restores the
          # dependencies the rust job saved. Only the rust job saves.
          shared-key: rust
          save-if: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.6.0'
          cache: pnpm

      - name: Build backend for process/memory sentinel
        # The sentinel launches the dev app through `cargo run`. Build the
        # exact binary first so its 120-second readiness budget measures app
        # startup rather than a cold Rust binary link on the macOS runner.
        timeout-minutes: 15
        run: cargo build -p videorc-backend --bin videorc-backend

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Short no-device process/memory sentinel
        run: pnpm smoke:process-memory:sentinel

      - name: Upload process/memory sentinel report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: process-memory-sentinel-${{ github.run_id }}
          path: docs/acceptance/artifacts/performance/**/*.json
          # warn: when an earlier step fails there is no report, and an
          # upload error only hides the real failure. The sentinel step itself
          # still fails the job if it produces no report.
          if-no-files-found: warn
          retention-days: 30

  rust-skip:
    name: Rust (test + clippy + fmt)
    needs: scope
    if: ${{ needs.scope.result == 'success' && needs.scope.outputs.macos_rust != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip hosted macOS Rust gates for an allow-listed docs or version-only change
        run: |
          echo "Skipped the hosted macOS Rust job for a ${{ needs.scope.outputs.kind }} change set."
          echo "Ordinary code PRs still run the identical rust job on macos-15."

  # Plan 242 S8: the JS gates run as parallel jobs. `js` keeps the old check
  # name and only requires them plus the shard coverage proof. Release reuse
  # (scripts/lib/reuse-release-ci-gates.mjs) reads every real job and step.
  js-checks:
    name: JS checks (audit, format, lint, typecheck)
    needs: scope
    if: ${{ needs.scope.result == 'success' && needs.scope.outputs.js == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.6.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: JS advisory audit
        run: pnpm audit:js

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  js-build:
    name: JS build and asset budget
    needs: scope
    if: ${{ needs.scope.result == 'success' && needs.scope.outputs.js == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.6.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer for initial asset budget
        run: pnpm build

      - name: Initial renderer asset budget
        run: pnpm check:renderer-assets

  js-node:
    name: Node logic tests
    needs: scope
    if: ${{ needs.scope.result == 'success' && needs.scope.outputs.js == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.6.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Node logic tests
        run: pnpm test:scripts

      - name: Source reconciliation smoke
        run: pnpm smoke:sources

  js-vitest:
    name: Desktop tests (${{ matrix.shard }}/4)
    needs: scope
    if: ${{ needs.scope.result == 'success' && needs.scope.outputs.js == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.6.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Desktop tests
        # Split by recorded time (apps/desktop/vitest-timings.json); each
        # shard reports the files it ran for the coverage proof in `js`.
        env:
          VIDEORC_VITEST_SHARD: ${{ matrix.shard }}/4
          VIDEORC_VITEST_REPORT: ${{ runner.temp }}/vitest-shard-${{ matrix.shard }}.json
        run: pnpm --filter @videorc/desktop exec vitest run --shard=${{ matrix.shard }}/4

      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/vitest-shard-${{ matrix.shard }}.json
          # warn: a shard that failed early writes no report, and an upload
          # error would only hide its real failure.
          if-no-files-found: warn
          overwrite: true
          retention-days: 14

  js:
    name: JS (format + lint + tests)
    needs: [scope, js-checks, js-build, js-node, js-vitest]
    if: ${{ always() && needs.scope.result == 'success' && needs.scope.outputs.js == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every JS gate job
        env:
          CHECKS: ${{ needs.js-checks.result }}
          BUILD: ${{ needs.js-build.result }}
          NODE_TESTS: ${{ needs.js-node.result }}
          VITEST: ${{ needs.js-vitest.result }}
        run: |
          echo "checks=$CHECKS build=$BUILD node=$NODE_TESTS vitest=$VITEST"
          for result in "$CHECKS" "$BUILD" "$NODE_TESTS" "$VITEST"; do
            if [ "$result" != success ]; then
              echo "Every JS gate job must succeed."
              exit 1
            fi
          done

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.6.0'

      - name: Download shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: vitest-shard-*
          path: ${{ runner.temp }}/vitest-shards
          merge-multiple: true

      - name: Every desktop test file ran exactly once
        run: node scripts/vitest-shard-report.mjs check "$RUNNER_TEMP"/vitest-shards/*.json

      - name: Recorded test times from this run
        # Download this to refresh apps/desktop/vitest-timings.json when the
        # check above warns that the shards are unbalanced.
        if: ${{ github.event_name == 'push' }}
        run: node scripts/vitest-shard-report.mjs merge "$RUNNER_TEMP"/vitest-shards/*.json

      - name: Upload recorded test times
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-timings
          path: apps/desktop/vitest-timings.json
          overwrite: true
          retention-days: 30

  js-skip:
    name: JS (format + lint + tests)
    needs: scope
    if: ${{ needs.scope.result == 'success' && needs.scope.outputs.js != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip JS gates for an allow-listed docs-record change
        run: |
          echo "Skipped the JS job for a ${{ needs.scope.outputs.kind }} change set."
          echo "Version-only release PRs still run JS. Ordinary code PRs still run the identical JS job."
