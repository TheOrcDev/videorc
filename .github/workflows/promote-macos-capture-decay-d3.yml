name: Promote exact macOS capture-decay D3 candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  promote:
    name: Verify and promote sealed candidate
    runs-on: macos-15
    environment: macos-d3-release
    timeout-minutes: 180

    steps:
      - name: Check out protected publication source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.0.9
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.6.0'
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: cargo-audit

      - name: Require protected main dispatch
        shell: bash
        env:
          VIDEORC_GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          if [[ "$GITHUB_REF" != 'refs/heads/main' || "$VIDEORC_GITHUB_REF_PROTECTED" != 'true' ]]; then
            echo 'Exact D3 promotion requires the protected main branch.' >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Source verification intentionally runs before any candidate-storage or
      # publication credential is introduced to a process.
      - name: Verify source and D3 acceptance contract
        run: |
          pnpm audit:deps
          pnpm typecheck
          pnpm lint
          pnpm test:scripts
          pnpm --filter @videorc/desktop test
          cargo fmt --check --all
          cargo test -p videorc-backend
          pnpm release:verify:capture-decay-d3 -- --protected-publication-ref --exact-promotion

      # This is the final authority boundary before candidate-read credentials
      # exist. It uses only runner-native tools plus GitHub's job-scoped token,
      # and independently rejects tracked changes before trusting the verifier.
      - name: Recheck accepted protected source before candidate download
        shell: bash
        env:
          GIT_NO_REPLACE_OBJECTS: '1'
          GIT_TERMINAL_PROMPT: '0'
          VIDEORC_GITHUB_API_TOKEN: ${{ github.token }}
          VIDEORC_GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'TheOrcDev/videorc'
          test "$VIDEORC_GITHUB_REF_PROTECTED" = 'true'
          test -n "$VIDEORC_GITHUB_API_TOKEN"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          head_sha="$(/usr/bin/git rev-parse 'HEAD^{commit}')"
          test "$head_sha" = "$GITHUB_SHA"
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_REF_NAME" = 'main'
          test "$GITHUB_REF_TYPE" = 'branch'
          /usr/bin/git diff --quiet --ignore-submodules=none HEAD --
          canonical_main_sha="$(
            /usr/bin/curl -q --fail --silent --show-error \
              --proto '=https' \
              --tlsv1.2 \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $VIDEORC_GITHUB_API_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              'https://api.github.com/repos/TheOrcDev/videorc/git/ref/heads/main' \
              | /usr/bin/plutil -extract object.sha raw -o - -
          )"
          unset VIDEORC_GITHUB_API_TOKEN
          [[ "$canonical_main_sha" =~ ^[0-9a-f]{40}$ ]]
          /usr/bin/git fetch --no-tags --force \
            https://github.com/TheOrcDev/videorc.git \
            '+refs/heads/main:refs/remotes/origin/main'
          test "$(/usr/bin/git rev-parse 'refs/remotes/origin/main^{commit}')" = "$canonical_main_sha"
          test "$head_sha" = "$canonical_main_sha"
          test "$(/usr/bin/plutil -extract status raw -o - docs/acceptance/macos-capture-decay-d3.json)" = 'accepted'
          pnpm release:verify:capture-decay-d3 -- --protected-publication-ref --exact-promotion
          test "$(/usr/bin/git rev-parse 'HEAD^{commit}')" = "$head_sha"
          /usr/bin/git diff --quiet --ignore-submodules=none HEAD --

      - name: Download immutable sealed candidate
        shell: bash
        run: >-
          node scripts/download-macos-d3-sealed-candidate.mjs
          --accepted-record docs/acceptance/macos-capture-decay-d3.json
          --output-dir "$RUNNER_TEMP/videorc-macos-d3-candidate"
        env:
          VIDEORC_MACOS_D3_CANDIDATE_S3_ACCESS_KEY_ID: ${{ secrets.VIDEORC_MACOS_D3_CANDIDATE_S3_ACCESS_KEY_ID }}
          VIDEORC_MACOS_D3_CANDIDATE_S3_BUCKET: ${{ secrets.VIDEORC_MACOS_D3_CANDIDATE_S3_BUCKET }}
          VIDEORC_MACOS_D3_CANDIDATE_S3_ENDPOINT_URL: ${{ secrets.VIDEORC_MACOS_D3_CANDIDATE_S3_ENDPOINT_URL }}
          VIDEORC_MACOS_D3_CANDIDATE_S3_FORCE_PATH_STYLE: ${{ secrets.VIDEORC_MACOS_D3_CANDIDATE_S3_FORCE_PATH_STYLE }}
          VIDEORC_MACOS_D3_CANDIDATE_S3_REGION: ${{ secrets.VIDEORC_MACOS_D3_CANDIDATE_S3_REGION }}
          VIDEORC_MACOS_D3_CANDIDATE_S3_SECRET_ACCESS_KEY: ${{ secrets.VIDEORC_MACOS_D3_CANDIDATE_S3_SECRET_ACCESS_KEY }}
          VIDEORC_MACOS_D3_CANDIDATE_S3_SESSION_TOKEN: ${{ secrets.VIDEORC_MACOS_D3_CANDIDATE_S3_SESSION_TOKEN }}
          VIDEORC_MACOS_D3_CANDIDATE_S3_TLS_ALLOWED_ISSUER_ORGANIZATIONS: ${{ vars.VIDEORC_MACOS_D3_CANDIDATE_S3_TLS_ALLOWED_ISSUER_ORGANIZATIONS }}
          VIDEORC_MACOS_D3_CANDIDATE_S3_TLS_ALLOWED_SPKI_SHA256: ${{ vars.VIDEORC_MACOS_D3_CANDIDATE_S3_TLS_ALLOWED_SPKI_SHA256 }}

      - name: Verify downloaded signatures, notarization, feeds, and exact bytes
        shell: bash
        run: >-
          node scripts/verify-macos-d3-sealed-candidate.mjs
          --accepted-record docs/acceptance/macos-capture-decay-d3.json
          --candidate-dir "$RUNNER_TEMP/videorc-macos-d3-candidate"
          --write-publication-descriptor
          "$RUNNER_TEMP/videorc-macos-d3-candidate/candidate-publication-verification.json"

      # Repeat immediately before the first public write. Candidate verification
      # receives no publication authority, and cannot alter tracked source or
      # substitute mutable local Git authority for current GitHub main.
      - name: Recheck accepted protected source before publication
        shell: bash
        env:
          GIT_NO_REPLACE_OBJECTS: '1'
          GIT_TERMINAL_PROMPT: '0'
          VIDEORC_GITHUB_API_TOKEN: ${{ github.token }}
          VIDEORC_GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'TheOrcDev/videorc'
          test "$VIDEORC_GITHUB_REF_PROTECTED" = 'true'
          test -n "$VIDEORC_GITHUB_API_TOKEN"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          head_sha="$(/usr/bin/git rev-parse 'HEAD^{commit}')"
          test "$head_sha" = "$GITHUB_SHA"
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_REF_NAME" = 'main'
          test "$GITHUB_REF_TYPE" = 'branch'
          /usr/bin/git diff --quiet --ignore-submodules=none HEAD --
          canonical_main_sha="$(
            /usr/bin/curl -q --fail --silent --show-error \
              --proto '=https' \
              --tlsv1.2 \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $VIDEORC_GITHUB_API_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              'https://api.github.com/repos/TheOrcDev/videorc/git/ref/heads/main' \
              | /usr/bin/plutil -extract object.sha raw -o - -
          )"
          unset VIDEORC_GITHUB_API_TOKEN
          [[ "$canonical_main_sha" =~ ^[0-9a-f]{40}$ ]]
          /usr/bin/git fetch --no-tags --force \
            https://github.com/TheOrcDev/videorc.git \
            '+refs/heads/main:refs/remotes/origin/main'
          test "$(/usr/bin/git rev-parse 'refs/remotes/origin/main^{commit}')" = "$canonical_main_sha"
          test "$head_sha" = "$canonical_main_sha"
          test "$(/usr/bin/plutil -extract status raw -o - docs/acceptance/macos-capture-decay-d3.json)" = 'accepted'
          pnpm release:verify:capture-decay-d3 -- --protected-publication-ref --exact-promotion
          test "$(/usr/bin/git rev-parse 'HEAD^{commit}')" = "$head_sha"
          /usr/bin/git diff --quiet --ignore-submodules=none HEAD --

      - name: Promote exact sealed bytes to release storage
        shell: bash
        run: pnpm release:upload:macos
        env:
          VIDEORC_GITHUB_API_TOKEN: ${{ github.token }}
          VIDEORC_CAPTURE_DECAY_D3_EXACT_PROMOTION: '1'
          VIDEORC_CAPTURE_DECAY_D3_DESTINATION_BINDING_SHA256: ${{ vars.VIDEORC_CAPTURE_DECAY_D3_DESTINATION_BINDING_SHA256 }}
          VIDEORC_CAPTURE_DECAY_D3_PUBLICATION_RECEIPT_PATH: ${{ runner.temp }}/videorc-macos-d3-candidate/capture-decay-d3-publication-receipt.json
          VIDEORC_MACOS_D3_PUBLICATION_VERIFICATION_DESCRIPTOR: ${{ runner.temp }}/videorc-macos-d3-candidate/candidate-publication-verification.json
          VIDEORC_RELEASE_DIR: ${{ runner.temp }}/videorc-macos-d3-candidate
          VIDEORC_RELEASE_MANIFEST_PATH: ${{ runner.temp }}/videorc-macos-d3-candidate/release.json
          VIDEORC_RELEASE_UPLOAD_PREFIX: ${{ vars.VIDEORC_RELEASE_UPLOAD_PREFIX }}
          VIDEORC_RELEASE_UPLOAD_S3_ACCESS_KEY_ID: ${{ secrets.VIDEORC_RELEASE_UPLOAD_S3_ACCESS_KEY_ID }}
          VIDEORC_RELEASE_UPLOAD_S3_BUCKET: ${{ secrets.VIDEORC_RELEASE_UPLOAD_S3_BUCKET }}
          VIDEORC_RELEASE_UPLOAD_S3_ENDPOINT_URL: ${{ secrets.VIDEORC_RELEASE_UPLOAD_S3_ENDPOINT_URL }}
          VIDEORC_RELEASE_UPLOAD_S3_FORCE_PATH_STYLE: ${{ secrets.VIDEORC_RELEASE_UPLOAD_S3_FORCE_PATH_STYLE }}
          VIDEORC_RELEASE_UPLOAD_S3_REGION: ${{ secrets.VIDEORC_RELEASE_UPLOAD_S3_REGION }}
          VIDEORC_RELEASE_UPLOAD_S3_SECRET_ACCESS_KEY: ${{ secrets.VIDEORC_RELEASE_UPLOAD_S3_SECRET_ACCESS_KEY }}
          VIDEORC_RELEASE_UPLOAD_S3_SESSION_TOKEN: ${{ secrets.VIDEORC_RELEASE_UPLOAD_S3_SESSION_TOKEN }}
          VIDEORC_RELEASE_UPLOAD_S3_TLS_ALLOWED_ISSUER_ORGANIZATIONS: ${{ vars.VIDEORC_RELEASE_UPLOAD_S3_TLS_ALLOWED_ISSUER_ORGANIZATIONS }}
          VIDEORC_RELEASE_UPLOAD_S3_TLS_ALLOWED_SPKI_SHA256: ${{ vars.VIDEORC_RELEASE_UPLOAD_S3_TLS_ALLOWED_SPKI_SHA256 }}

      - name: Verify exact-promotion receipt
        shell: bash
        run: >-
          pnpm release:verify:capture-decay-d3 --
          --publication-receipt
          "$RUNNER_TEMP/videorc-macos-d3-candidate/capture-decay-d3-publication-receipt.json"

      - name: Retain exact promoted subjects for isolated attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: videorc-macos-capture-decay-d3-exact-promotion
          path: |
            ${{ runner.temp }}/videorc-macos-d3-candidate/candidate.json
            ${{ runner.temp }}/videorc-macos-d3-candidate/candidate-seal-receipt.json
            ${{ runner.temp }}/videorc-macos-d3-candidate/capture-decay-d3-publication-receipt.json
            ${{ runner.temp }}/videorc-macos-d3-candidate/*.dmg
            ${{ runner.temp }}/videorc-macos-d3-candidate/*.sha256
            ${{ runner.temp }}/videorc-macos-d3-candidate/release.json
            ${{ runner.temp }}/videorc-macos-d3-candidate/*.zip
            ${{ runner.temp }}/videorc-macos-d3-candidate/*.zip.blockmap
            ${{ runner.temp }}/videorc-macos-d3-candidate/latest-mac.yml
          if-no-files-found: error
          retention-days: 90

  attest:
    name: Attest exact promoted candidate
    needs: promote
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download exact promotion subjects
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: videorc-macos-capture-decay-d3-exact-promotion
          path: promotion

      - name: Cryptographically attest receipt and every promoted candidate artifact
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            promotion/candidate.json
            promotion/candidate-seal-receipt.json
            promotion/capture-decay-d3-publication-receipt.json
            promotion/*.dmg
            promotion/*.sha256
            promotion/release.json
            promotion/*.zip
            promotion/*.zip.blockmap
            promotion/latest-mac.yml

      - name: Stage offline attestation bundle
        shell: bash
        run: >-
          cp
          "${{ steps.attest.outputs.bundle-path }}"
          promotion/capture-decay-d3-publication-attestation.json

      - name: Retain offline exact-promotion attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: videorc-macos-capture-decay-d3-publication-attestation
          path: promotion/capture-decay-d3-publication-attestation.json
          if-no-files-found: error
          retention-days: 90
