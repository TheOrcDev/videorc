name: Release macOS

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: 'Beta release id written to release.json, for example 0.9.0-beta.1'
        required: false
        default: '0.9.0-beta.1'
      display_version:
        description: 'Human-readable beta version written to release.json'
        required: false
        default: '0.9.0 beta 1'
      release_notes_url:
        description: 'Public release notes URL written to release.json'
        required: false
        default: 'https://www.videorc.com/releases/0.9.0-beta.1'
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  # Prevent an older changelog or latest pointer from racing another platform.
  group: release-publication
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  macos:
    name: Build signed macOS artifact
    runs-on: macos-15
    # smoke:local-gates intentionally includes a 60m idle soak plus a 15m
    # analyzed recording; leave bounded room for build, Rust, and packaging.
    timeout-minutes: 240

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The one-time D3 accepted state verifies candidate ancestry and the
          # exact acceptance-record-only diff before its first publication.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.0.9
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.6.0'
          cache: pnpm

      - name: Verify capture-decay D3 publication state
        # Run before dependency installation so lifecycle scripts cannot rewrite
        # the local origin/main authority used by the protected-ref gate.
        run: >-
          node scripts/verify-macos-capture-decay-d3.mjs
          --protected-publication-ref
          --regular-release

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install cargo-audit
        # Fetch the prebuilt binary from GitHub releases instead of building it
        # from source. `cargo install cargo-audit --locked` compiles the whole
        # tool on every cache miss (minutes); the release binary lands in
        # seconds and does not depend on the crates.io registry being reachable.
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: cargo-audit

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check signing and notarization prerequisites
        run: pnpm release:preflight:macos
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Check private download storage prerequisites
        run: pnpm release:upload:preflight:macos
        env:
          VIDEORC_DOWNLOAD_S3_ACCESS_KEY_ID: ${{ secrets.VIDEORC_DOWNLOAD_S3_ACCESS_KEY_ID }}
          VIDEORC_DOWNLOAD_S3_BUCKET: ${{ secrets.VIDEORC_DOWNLOAD_S3_BUCKET }}
          VIDEORC_DOWNLOAD_S3_ENDPOINT_URL: ${{ secrets.VIDEORC_DOWNLOAD_S3_ENDPOINT_URL }}
          VIDEORC_DOWNLOAD_S3_FORCE_PATH_STYLE: ${{ secrets.VIDEORC_DOWNLOAD_S3_FORCE_PATH_STYLE }}
          VIDEORC_DOWNLOAD_S3_REGION: ${{ secrets.VIDEORC_DOWNLOAD_S3_REGION }}
          VIDEORC_DOWNLOAD_S3_SECRET_ACCESS_KEY: ${{ secrets.VIDEORC_DOWNLOAD_S3_SECRET_ACCESS_KEY }}
          VIDEORC_DOWNLOAD_S3_SESSION_TOKEN: ${{ secrets.VIDEORC_DOWNLOAD_S3_SESSION_TOKEN }}
          VIDEORC_DOWNLOAD_S3_TLS_ALLOWED_ISSUER_ORGANIZATIONS: ${{ vars.VIDEORC_DOWNLOAD_S3_TLS_ALLOWED_ISSUER_ORGANIZATIONS }}
          VIDEORC_DOWNLOAD_S3_TLS_ALLOWED_SPKI_SHA256: ${{ vars.VIDEORC_DOWNLOAD_S3_TLS_ALLOWED_SPKI_SHA256 }}

      - name: Ensure smoke-test FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            brew install ffmpeg
          fi

      # This is a deterministic check of the hermetic release profiles and D3
      # evidence oracle. Real camera/TCC evidence remains an acceptance artifact.
      - name: Verify capture-decay release contract
        run: pnpm smoke:capture-decay-soak:contract

      - name: Verify
        run: |
          cargo fmt --check --all
          pnpm audit:deps
          pnpm smoke:local-gates
        env:
          VIDEORC_CAPTURE_DECAY_OUTPUT_DIR: ${{ github.workspace }}/capture-decay-evidence/idle
          VIDEORC_CAPTURE_DECAY_LONG_RECORDING_OUTPUT_DIR: ${{ github.workspace }}/capture-decay-evidence/long-recording

      - name: Retain capture-decay release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: videorc-macos-capture-decay-evidence
          path: capture-decay-evidence/**
          if-no-files-found: error
          retention-days: 30

      - name: Verify publication source remained clean before build
        # Dependency installation, tests, and evidence generators must not
        # mutate tracked source that would then be silently packaged into the
        # signed artifact. The uploader repeats this gate after the build.
        run: >-
          pnpm release:verify:capture-decay-d3 --
          --protected-publication-ref
          --regular-release

      - name: Build signed and notarized macOS release
        # The private updater publication below requires latest-mac.yml plus
        # its zip and blockmap; the signed target produces only the DMG.
        run: pnpm dist:desktop:release
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          VIDEORC_RELEASE_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.release_id || '' }}
          VIDEORC_RELEASE_DISPLAY_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.display_version || '' }}
          VIDEORC_RELEASE_NOTES_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.release_notes_url || '' }}

      - name: Validate signed macOS artifact
        run: pnpm release:validate:macos

      - name: Preflight active packaged performance budget
        run: >-
          pnpm perf:budget:preflight
          --artifact-only
          --scenario detached-native-preview
          --profile-class short-sentinel
          --warmup-seconds 60
          --measurement-seconds 120
          --sample-interval-ms 1000
        env:
          VIDEORC_PERF_ACTIVE_BUDGET_PATH: config/performance-budgets/v1/active/macos-release.json
          VIDEORC_PERF_ACTIVE_BUDGET_PROFILE: ${{ vars.VIDEORC_PERF_RELEASE_BUDGET_PROFILE }}
          VIDEORC_PERF_APP_EXECUTABLE: apps/desktop/release/mac-arm64/Videorc.app/Contents/MacOS/Videorc

      # Generic hosted macOS lacks the stable hardware and TCC grants required
      # for a truthful ScreenCaptureKit run. The signed payload is checked here
      # against reviewed evidence; runtime calibration stays on the authorized
      # self-hosted performance runner.
      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: videorc-macos
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.dmg.blockmap
            apps/desktop/release/*.zip
            apps/desktop/release/*.zip.blockmap
            apps/desktop/release/latest-mac.yml
            apps/desktop/release/*.sha256
            apps/desktop/release/release.json
          if-no-files-found: error

      # Repeat the event-sensitive protected-ref gate after the long
      # verification and signed build. The inline checks do not trust a
      # repository script or the checkout's mutable origin configuration.
      - name: Recheck protected publication authority
        shell: bash
        env:
          GIT_NO_REPLACE_OBJECTS: '1'
          GIT_TERMINAL_PROMPT: '0'
          VIDEORC_GITHUB_API_TOKEN: ${{ github.token }}
          VIDEORC_GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'TheOrcDev/videorc'
          test "$VIDEORC_GITHUB_REF_PROTECTED" = 'true'
          test -n "$VIDEORC_GITHUB_API_TOKEN"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          head_sha="$(/usr/bin/git rev-parse 'HEAD^{commit}')"
          test "$head_sha" = "$GITHUB_SHA"
          /usr/bin/git diff --quiet --ignore-submodules=none HEAD --
          canonical_main_sha="$(
            /usr/bin/curl -q --fail --silent --show-error \
              --proto '=https' \
              --tlsv1.2 \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $VIDEORC_GITHUB_API_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              'https://api.github.com/repos/TheOrcDev/videorc/git/ref/heads/main' \
              | /usr/bin/plutil -extract object.sha raw -o - -
          )"
          unset VIDEORC_GITHUB_API_TOKEN
          [[ "$canonical_main_sha" =~ ^[0-9a-f]{40}$ ]]
          /usr/bin/git fetch --no-tags --force \
            https://github.com/TheOrcDev/videorc.git \
            '+refs/heads/main:refs/remotes/origin/main'
          test "$(/usr/bin/git rev-parse 'refs/remotes/origin/main^{commit}')" = "$canonical_main_sha"
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              test "$GITHUB_REF" = 'refs/heads/main'
              test "$GITHUB_REF_NAME" = 'main'
              test "$GITHUB_REF_TYPE" = 'branch'
              test "$head_sha" = "$canonical_main_sha"
              ;;
            push)
              test "$GITHUB_REF_TYPE" = 'tag'
              [[ "$GITHUB_REF" =~ ^refs/tags/v[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
              test "$GITHUB_REF_NAME" = "${GITHUB_REF#refs/tags/}"
              /usr/bin/git fetch --no-tags --force \
                https://github.com/TheOrcDev/videorc.git \
                "+${GITHUB_REF}:refs/videorc/verified-release-tag"
              verified_tag_sha="$(/usr/bin/git rev-parse 'refs/videorc/verified-release-tag^{commit}')"
              test "$verified_tag_sha" = "$GITHUB_SHA"
              test "$verified_tag_sha" = "$head_sha"
              /usr/bin/git merge-base --is-ancestor "$verified_tag_sha" 'refs/remotes/origin/main'
              ;;
            *)
              echo 'Unsupported macOS publication event.' >&2
              exit 1
              ;;
          esac
          pnpm release:verify:capture-decay-d3 -- --protected-publication-ref --regular-release
          test "$(/usr/bin/git rev-parse 'HEAD^{commit}')" = "$head_sha"
          /usr/bin/git diff --quiet --ignore-submodules=none HEAD --

      - name: Upload beta artifacts to private download storage
        run: pnpm release:upload:macos
        env:
          VIDEORC_DOWNLOAD_S3_ACCESS_KEY_ID: ${{ secrets.VIDEORC_DOWNLOAD_S3_ACCESS_KEY_ID }}
          VIDEORC_DOWNLOAD_S3_BUCKET: ${{ secrets.VIDEORC_DOWNLOAD_S3_BUCKET }}
          VIDEORC_DOWNLOAD_S3_ENDPOINT_URL: ${{ secrets.VIDEORC_DOWNLOAD_S3_ENDPOINT_URL }}
          VIDEORC_DOWNLOAD_S3_FORCE_PATH_STYLE: ${{ secrets.VIDEORC_DOWNLOAD_S3_FORCE_PATH_STYLE }}
          VIDEORC_DOWNLOAD_S3_REGION: ${{ secrets.VIDEORC_DOWNLOAD_S3_REGION }}
          VIDEORC_DOWNLOAD_S3_SECRET_ACCESS_KEY: ${{ secrets.VIDEORC_DOWNLOAD_S3_SECRET_ACCESS_KEY }}
          VIDEORC_DOWNLOAD_S3_SESSION_TOKEN: ${{ secrets.VIDEORC_DOWNLOAD_S3_SESSION_TOKEN }}
          VIDEORC_DOWNLOAD_S3_TLS_ALLOWED_ISSUER_ORGANIZATIONS: ${{ vars.VIDEORC_DOWNLOAD_S3_TLS_ALLOWED_ISSUER_ORGANIZATIONS }}
          VIDEORC_DOWNLOAD_S3_TLS_ALLOWED_SPKI_SHA256: ${{ vars.VIDEORC_DOWNLOAD_S3_TLS_ALLOWED_SPKI_SHA256 }}
          VIDEORC_CAPTURE_DECAY_D3_DESTINATION_BINDING_SHA256: ${{ vars.VIDEORC_CAPTURE_DECAY_D3_DESTINATION_BINDING_SHA256 }}
          VIDEORC_RELEASE_UPLOAD_PREFIX: ${{ vars.VIDEORC_RELEASE_UPLOAD_PREFIX }}
