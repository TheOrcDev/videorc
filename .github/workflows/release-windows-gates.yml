name: Windows release source gates
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  gates:
    name: Windows release source gates
    runs-on: windows-latest
    # A 75-minute source run timed out during auditor install after completing 25x/3x checks.
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt --no-self-update
          rustup default stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          shared-key: ${{ github.event_name == 'pull_request' && 'pr-windows-gates-v1' || 'main-windows-gates-v1' }}
          cache-workspace-crates: false
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 11.0.9
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.6.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clippy
        # cfg(windows) code is invisible to the macOS clippy job; this is the
        # only lint pass that sees the named-pipe/Job-Object/dshow arms. The
        # unused-code lint family is allowed for now: macOS-only helpers are
        # dead code under cfg(windows) (the known cross-check warning wall,
        # docs/windows-port-plan.md) — burn that down, then drop the allows.
        run: cargo clippy -p videorc-backend -- -D warnings -A dead_code -A unused_imports -A unused_variables -A unused_mut

      - name: Preview bounds concurrency (25 stability passes)
        shell: pwsh
        run: |
          for ($pass = 1; $pass -le 25; $pass++) {
            Write-Host "Preview bounds concurrency pass $pass/25"
            cargo test -p videorc-backend preview_surface::tests::superseded_bounds_reply_and_event_never_publish_captured_old_status -- --exact
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Source and audio ownership (25 stability passes)
        shell: pwsh
        run: |
          foreach ($pass in 1..25) {
            foreach ($filter in @("source_audio_tap", "source_iso", 'intermittent_pipe_pressure_', 'fifo_write_virtual_', 'audio_capture_adapter', 'live_source_switch', 'session_audio', 'owned_pcm_silent_drain', 'caption_contract_fixture', 'session_chat_totals_fake_provider_rpc', 'live_control_', 'fifo::windows_tests', 'fenced_layout_join_waits_past_command_timeout_and_starting_clear', 'warm_microphone', 'partial_raw_fifo_bytes_refresh_full_recording_queue_liveness', 'abandoned_live_candidate_cleanup_is_generation_and_latest_intent_fenced', 'auxiliary_edit_uses_intent_before_scene_fence_and_cancels_retired_source_honestly', 'abandoned_screen_stop_admission_does_not_wait_for_native_transition', 'source_edit', 'windows_capture_owner', 'windows_live_', 'windows_source_', 'native_source_output_authority', 'windows_d3d11_cfr', 'cancelled_capture_and_pointer_failure', 'failed_capture_retirement_signal', 'ffmpeg_', 'published_', 'retired_stderr_generation', 'windows_mf_probe')) {
              Write-Host "Source ownership $filter pass $pass/25"
              $result = cargo test -p videorc-backend $filter 2>&1 | Out-String
              $status = $LASTEXITCODE
              Write-Host $result
              if ($status -ne 0 -or $result -notmatch 'test result: ok\. [1-9][0-9]* passed') {
                throw "Source ownership failed or executed zero tests: $filter pass $pass"
              }
            }
            Write-Host "OAuth smoke startup ownership pass $pass/25"
            $result = node --test --test-reporter=tap scripts/lib/oauth-smoke-launch.test.mjs 2>&1 | Out-String
            $status = $LASTEXITCODE
            Write-Host $result
            if ($status -ne 0 -or $result -notmatch '# pass [1-9][0-9]*') {
              throw "OAuth smoke startup ownership failed or executed zero tests: pass $pass"
            }
            Write-Host "Caption fake-provider progress pass $pass/25"
            $result = node --test --test-reporter=tap scripts/lib/fake-caption-service.test.mjs 2>&1 | Out-String
            $status = $LASTEXITCODE
            Write-Host $result
            if ($status -ne 0 -or $result -notmatch '# pass [1-9][0-9]*') {
              throw "Caption fake-provider progress failed or executed zero tests: pass $pass"
            }
            Write-Host "Co-host caption audio ownership pass $pass/25"
            $result = node --test --test-reporter=tap scripts/lib/cohost-caption-audio.test.mjs 2>&1 | Out-String
            $status = $LASTEXITCODE
            Write-Host $result
            if ($status -ne 0 -or $result -notmatch '# pass [1-9][0-9]*') {
              throw "Co-host caption audio ownership failed or executed zero tests: pass $pass"
            }
            Write-Host "Record latency waiter ownership pass $pass/25"
            $result = node --test --test-reporter=tap scripts/lib/record-latency-events.test.mjs 2>&1 | Out-String
            $status = $LASTEXITCODE
            Write-Host $result
            if ($status -ne 0 -or $result -notmatch '# pass [1-9][0-9]*') {
              throw "Record latency waiter ownership failed or executed zero tests: pass $pass"
            }
            Write-Host "Remote client wait ownership pass $pass/25"
            $result = node --test --test-reporter=tap scripts/lib/remote-control-client.test.mjs 2>&1 | Out-String
            $status = $LASTEXITCODE
            Write-Host $result
            if ($status -ne 0 -or $result -notmatch '# pass [1-9][0-9]*') {
              throw "Remote client wait ownership failed or executed zero tests: pass $pass"
            }
            Write-Host "Fake activity receipt ownership pass $pass/25"
            $result = node --test --test-reporter=tap scripts/lib/comments-totals-probe.test.mjs 2>&1 | Out-String
            $status = $LASTEXITCODE
            Write-Host $result
            if ($status -ne 0 -or $result -notmatch '# pass [1-9][0-9]*') {
              throw "Fake activity receipt ownership failed or executed zero tests: pass $pass"
            }
          }

      - name: Test (3 stability passes)
        # Executes the Windows-only unit tests (named pipes, process Job
        # Objects, dshow input builders) that `pnpm check:windows` can only
        # compile. ffmpeg-spawning tests are #[ignore]d, same as macOS CI.
        #
        # Process and lifecycle races have previously passed once on a fork
        # before failing on the identical upstream commit. Repeating the full
        # suite makes the Windows gate evidence stronger than a lucky run.
        run: |
          for ($pass = 1; $pass -le 3; $pass++) {
            Write-Host "Windows Rust test pass $pass/3"
            cargo test -p videorc-backend
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Tracked text integrity
        run: pnpm check:text-files

      - name: Desktop tests
        run: pnpm --filter @videorc/desktop test

      - name: Node logic tests
        run: pnpm test:scripts

      - name: Format
        run: pnpm format:check

      - name: TypeScript
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

      - name: Rust format
        run: cargo fmt --check --all

      - name: JavaScript advisory audit
        run: pnpm audit:js

      - name: Install Rust advisory auditor
        run: cargo install cargo-audit --locked

      - name: Rust advisory audit
        run: pnpm audit:rust
