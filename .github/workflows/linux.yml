name: Linux

# Linux L1.5 adds the production encoder policy to the compile-and-test gate.
# It still is not a shipping application claim: capture, preview, packaging,
# and real-device acceptance land in later phases tracked by the port plan.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Linux gates (FFmpeg policy + Rust compile/test)
    runs-on: ubuntu-latest
    # Warm-cache Rust tests on this job sit near the old 30m wall; portal
    # proof-surface PRs were cancelled mid-run. Keep headroom for this suite.
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache pinned Linux FFmpeg
        uses: actions/cache@v4
        with:
          path: |
            vendor/ffmpeg/_build
            vendor/ffmpeg/linux-x64
          key: linux-ffmpeg-${{ hashFiles('vendor/ffmpeg/linux-pin.json') }}

      - name: Test Linux FFmpeg policy
        run: node --test scripts/lib/ffmpeg-linux-pin.test.mjs

      - name: Fetch and verify pinned Linux FFmpeg
        # This executes the staged Linux binary and fails closed unless its
        # configure flags and encoder table prove LGPL-only VAAPI + OpenH264.
        run: node scripts/fetch-ffmpeg-linux.mjs

      - name: Install PipeWire/SPA compile dependencies
        # The Linux-only `pipewire` crate (libspa-sys) finds libpipewire-0.3
        # via pkg-config and generates bindings with clang/bindgen. `appstream`
        # provides appstreamcli for the metainfo structural gate below.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            clang \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            appstream

      - name: Validate Linux packaging assets
        # Plan 071 structural gate (runs after the apt step above installs
        # appstream/appstreamcli): the AppStream metainfo must validate, the
        # distro package contract + icon dimension unit tests must pass, and the
        # 512x512 app icon must be what electron-builder will generate hicolor
        # icons from. No full electron-builder run needed for these.
        run: |
          set -euo pipefail
          appstreamcli validate packaging/linux/metainfo/dev.theorcdev.videorc.metainfo.xml
          node --test scripts/lib/linux-dist-package.test.mjs
          node --input-type=module -e "
            import fs from 'node:fs';
            const { readPngDimensions } = await import('./scripts/lib/linux-dist-package.mjs');
            const icon = fs.readFileSync('apps/desktop/build-resources/icon.png');
            const d = readPngDimensions(icon);
            if (!d || d.width !== 512 || d.height !== 512) {
              throw new Error('build-resources/icon.png must be a 512x512 PNG, got ' + JSON.stringify(d));
            }
            console.log('icon.png 512x512 OK');
          "

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        # clippy -D warnings is the compile gate (compile errors fail it
        # regardless of the lint allows), matching ci.yml and windows.yml —
        # no separate cargo check, no pnpm (the JS steps use Node directly), and
        # no fmt (rustfmt output is platform-independent; ci.yml owns it).
        # cfg(linux) makes macOS/Windows-only helpers dead or their imports
        # unused. Keep this allow list identical to windows.yml while the
        # cross-platform warning wall is burned down; drop both lists together.
        run: cargo clippy -p videorc-backend -- -D warnings -A dead_code -A unused_imports -A unused_variables -A unused_mut

      - name: Test
        # Platform-neutral tests run normally. Tests that require Apple or
        # Windows frameworks remain gated at their implementation boundary.
        run: cargo test -p videorc-backend
