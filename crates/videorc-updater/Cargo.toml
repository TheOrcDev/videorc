[package]
name = "videorc-updater"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
description = "Plan 260: Electron's update rules in Rust, on today's feed format (plan 220 P5-D3), for the GPUI app's second feed (P5-D6)."

[dependencies]
# The feed's SHA-512 arrives as base64 (electron-builder's format).
base64 = "0.22.1"
# Versions are ordered as electron-updater orders them.
semver = "1.0.28"
# Linux reads the public changelog, which is JSON.
serde_json = "1.0.150"
sha2 = "0.10.9"

[target.'cfg(target_os = "macos")'.dependencies]
# The swap exchanges two bundles in one step (renamex_np), and asks whether
# a folder may be written (access).
libc = "0.2.186"
