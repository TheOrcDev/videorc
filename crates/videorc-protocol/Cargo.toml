[package]
name = "videorc-protocol"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
description = "Plan 260: Every wire type of the backend protocol, serde only, extracted from crates/videorc-backend/src/protocol."

[dependencies]
# `OverlayRect`'s validation (`Result`, `bail!`), moved with the type.
anyhow = "1.0"
# RFC 3339 timestamps in a few wire shapes, as the backend parses them.
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
