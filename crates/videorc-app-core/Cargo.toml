[package]
name = "videorc-app-core"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
description = "Plan 260: The Videorc app without a UI: the typed backend client, the supervisor, the Studio state machine and every page's view-model, the smoke command server, settings."

[dependencies]
# The typed client's WebSocket and its request/event plumbing.
futures-util = "0.3"
tokio-tungstenite = "0.29"
# The wire types (plan 260 S1.1).
videorc-protocol = { workspace = true }
anyhow = "1.0"
# The session clock parses the backend's RFC 3339 `startedAt`, and Health
# formats its timestamps. Already in the tree through videorc-protocol.
chrono = "0.4"
# The toast guard's patterns (`guardToastText`). Already in the tree.
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The workspace key in a development profile path (`paths::workspace_key`).
sha2 = "0.10"
# The single-instance lock's hand-off token.
getrandom = "0.4"
# The interruption lease routes' query strings.
url = "2.5"
# The backend ownership token and admin request ids.
uuid = { version = "1.19", features = ["v4"] }
tokio = { version = "1.48", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# Paused-clock tests (`start_paused`): the grant watch's polls advance
# exactly, never by the machine's load.
tokio = { version = "1.48", features = ["test-util"] }
