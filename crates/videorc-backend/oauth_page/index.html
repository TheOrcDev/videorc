<!doctype html>
<html lang="en" data-tone="{{TONE}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>{{DOC_TITLE}}</title>
    <style>
      /* The Videorc window palette (videorc-design): black glass, chrome text,
         hairline edges. Dark always, like the app's Preview and Chat windows:
         the orb is black glass. Colour is information only: green for
         connected, the brand red for a failed sign-in. */
      :root {
        --bg: #0d0d0f;
        --panel: #141417;
        --hairline: rgba(255, 255, 255, 0.1);
        --text: #f4f4f5;
        --muted: #a1a1aa;
        --subtle: #71717a;
        --shadow: 0 16px 70px rgba(0, 0, 0, 0.55);
        --sheen: rgba(255, 255, 255, 0.06);
        --good: #30d158;
        --bad: #f0444a;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background:
          radial-gradient(60rem 36rem at 50% -10%, var(--sheen), transparent 70%), var(--bg);
        color: var(--text);
        font:
          15px/1.5 -apple-system,
          BlinkMacSystemFont,
          'SF Pro Text',
          'Segoe UI',
          system-ui,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 420px;
        padding: 40px 32px 28px;
        border-radius: 20px;
        background: var(--panel);
        box-shadow:
          var(--shadow),
          0 0 0 1px var(--hairline);
        text-align: center;
        animation: arrive 150ms ease-out both;
      }
      .mark {
        position: relative;
        width: 96px;
        height: 96px;
        margin: 0 auto 24px;
      }
      .mark img {
        width: 96px;
        height: 96px;
        display: block;
      }
      .badge {
        position: absolute;
        right: -2px;
        bottom: -2px;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--panel);
        box-shadow: 0 0 0 1px var(--hairline);
      }
      .badge svg {
        width: 22px;
        height: 22px;
      }
      [data-tone='good'] .badge svg {
        color: var(--good);
      }
      [data-tone='bad'] .badge svg {
        color: var(--bad);
      }
      h1 {
        margin: 0;
        font-size: 20px;
        line-height: 1.3;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .lede {
        margin: 8px 0 0;
        color: var(--muted);
      }
      .detail {
        margin: 16px 0 0;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--sheen);
        box-shadow: 0 0 0 1px var(--hairline);
        color: var(--muted);
        font-size: 13px;
        text-align: left;
        overflow-wrap: anywhere;
      }
      .next {
        margin: 24px 0 0;
        padding-top: 16px;
        border-top: 1px solid var(--hairline);
        color: var(--subtle);
        font-size: 13px;
      }
      @keyframes arrive {
        from {
          opacity: 0;
          transform: scale(0.98);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        main {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">
        <img alt="Videorc" src="data:image/png;base64,{{LOGO}}" />
        <span class="badge" aria-hidden="true">{{BADGE}}</span>
      </div>
      <h1>{{TITLE}}</h1>
      <p class="lede">{{LEDE}}</p>
      {{DETAIL}}
      <p class="next">{{NEXT}}</p>
    </main>
  </body>
</html>
