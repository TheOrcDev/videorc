<!doctype html>
<html lang="en" data-tone="{{TONE}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>{{DOC_TITLE}}</title>
    <style>
      /* The Videorc window palette (plan 208, D13): the desktop's neutral
         solids and text tiers (window-palette.ts) on a flat page, no ground:
         it is a three-second page in someone's browser. It follows the
         browser's scheme like the desktop, light the crisp invert. Colour is
         information only: green for connected, the brand red for a failed
         sign-in. served_page_palette.rs fails when a copy drifts. */
      :root {
        --bg: #070707;
        --panel: #0d0d0d;
        --hairline: oklch(1 0 0 / 10%);
        --text: #f5f5f5;
        --muted: #a1a1a1;
        --subtle: #868686;
        /* The desktop's dialog drop. */
        --shadow: 0 14px 44px oklch(0 0 0 / 50%), 0 1px 3px oklch(0 0 0 / 30%);
        --sheen: rgba(255, 255, 255, 0.06);
        --good: #30d158;
        --bad: #e23b3f;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #fafafa;
          --panel: #ffffff;
          --hairline: oklch(0 0 0 / 12%);
          --text: #0f0f0f;
          --muted: #5b5b5b;
          --subtle: #6f6f6f;
          --shadow: 0 16px 48px oklch(0 0 0 / 20%), 0 1px 10px oklch(0 0 0 / 14%);
          --sheen: rgba(0, 0, 0, 0.04);
          /* The desktop's light --success: the dark green fades on white. */
          --good: oklch(0.6 0.14 150);
          --bad: #d02a30;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.5 -apple-system,
          BlinkMacSystemFont,
          'SF Pro Text',
          'Segoe UI',
          system-ui,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 420px;
        padding: 40px 32px 28px;
        border-radius: 20px;
        background: var(--panel);
        box-shadow:
          var(--shadow),
          0 0 0 1px var(--hairline);
        text-align: center;
        animation: arrive 150ms ease-out both;
      }
      .mark {
        position: relative;
        width: 96px;
        height: 96px;
        margin: 0 auto 24px;
      }
      .mark img {
        width: 96px;
        height: 96px;
        display: block;
      }
      .badge {
        position: absolute;
        right: -2px;
        bottom: -2px;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--panel);
        box-shadow: 0 0 0 1px var(--hairline);
      }
      .badge svg {
        width: 22px;
        height: 22px;
      }
      [data-tone='good'] .badge svg {
        color: var(--good);
      }
      [data-tone='bad'] .badge svg {
        color: var(--bad);
      }
      h1 {
        margin: 0;
        font-size: 20px;
        line-height: 1.3;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .lede {
        margin: 8px 0 0;
        color: var(--muted);
      }
      .detail {
        margin: 16px 0 0;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--sheen);
        box-shadow: 0 0 0 1px var(--hairline);
        color: var(--muted);
        font-size: 13px;
        text-align: left;
        overflow-wrap: anywhere;
      }
      .next {
        margin: 24px 0 0;
        padding-top: 16px;
        border-top: 1px solid var(--hairline);
        color: var(--subtle);
        font-size: 13px;
      }
      @keyframes arrive {
        from {
          opacity: 0;
          transform: scale(0.98);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        main {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">
        <img alt="Videorc" src="data:image/png;base64,{{LOGO}}" />
        <span class="badge" aria-hidden="true">{{BADGE}}</span>
      </div>
      <h1>{{TITLE}}</h1>
      <p class="lede">{{LEDE}}</p>
      {{DETAIL}}
      <p class="next">{{NEXT}}</p>
    </main>
  </body>
</html>
