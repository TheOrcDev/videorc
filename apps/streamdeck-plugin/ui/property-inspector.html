<!doctype html>
<!--
  Shared property inspector for the seven setting-backed Videorc actions
  (saved-scene, scene-apply, takeover-toggle, banner-toggle, sound-play, window-front,
  stream-manager-screen). No external dependencies:
  it speaks the Stream Deck property-inspector WebSocket protocol directly
  and asks the plugin (sendToPlugin) for live options from Videorc's
  remote.state and remote.describe projections.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Videorc</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        padding: 10px 12px;
        background: #2d2d2d;
        color: #d8d8d8;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 12px;
      }
      label {
        display: block;
        margin: 0 0 4px;
        color: #969696;
      }
      select,
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border: 1px solid #3d3d3d;
        border-radius: 5px;
        background: #3d3d3d;
        color: #d8d8d8;
        font-size: 12px;
      }
      select:focus,
      input:focus {
        outline: 1px solid #0078ff;
      }
      .hint {
        margin: 8px 0 0;
        color: #969696;
      }
      .field + .field {
        margin-top: 10px;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="fields"></div>
    <p class="hint" id="hint"></p>

    <script>
      // Per-action wiring: which settings keys this inspector edits. Every
      // field of one action picks from the same live options.
      const ACTIONS = {
        'com.videorc.streamdeck.saved-scene': {
          fields: [{ key: 'sceneId', label: 'Scene' }],
          hint: 'Saved scenes from Videorc, in library order.'
        },
        'com.videorc.streamdeck.scene-apply': {
          fields: [{ key: 'layoutPreset', label: 'Layout preset' }],
          hint: 'Presets come from Videorc while it is running.'
        },
        'com.videorc.streamdeck.takeover-toggle': {
          fields: [{ key: 'assetId', label: 'Takeover' }],
          hint: 'Your saved takeover screens (BRB, starting soon).'
        },
        'com.videorc.streamdeck.banner-toggle': {
          fields: [{ key: 'bannerId', label: 'Banner' }],
          hint: 'Your banners from Assets → Banners in Videorc.'
        },
        'com.videorc.streamdeck.sound-play': {
          fields: [{ key: 'soundId', label: 'Sound' }],
          hint: 'Your sounds from Assets → Sounds in Videorc.'
        },
        'com.videorc.streamdeck.window-front': {
          fields: [{ key: 'window', label: 'Window' }],
          hint: 'Which window the key brings to the front.'
        },
        'com.videorc.streamdeck.stream-manager-screen': {
          fields: [
            { key: 'presentingScreen', label: 'Presenting screen' },
            { key: 'monitorScreen', label: 'Monitor screen' }
          ],
          hint:
            'The Presenting screen is the one viewers see. The Monitor screen is where ' +
            'you read chat. A tap moves the Stream Manager to the other screen. Hold the ' +
            'key to bring it to the front where it is, or to close it when you are using it.'
        }
      }

      let websocket = null
      let pluginUUID = null
      let actionUUID = null
      let action = null
      let settings = {}
      const controls = []

      const fieldsEl = document.getElementById('fields')
      const hintEl = document.getElementById('hint')

      function send(payload) {
        if (websocket && websocket.readyState === WebSocket.OPEN) {
          websocket.send(JSON.stringify(payload))
        }
      }

      function saveValue(key, value) {
        settings = { ...settings, [key]: value }
        send({ event: 'setSettings', context: pluginUUID, payload: settings })
      }

      function valueOf(key) {
        return String(settings[key] ?? '')
      }

      function buildFields() {
        fieldsEl.innerHTML = ''
        controls.length = 0
        action.fields.forEach((field, index) => {
          const wrapper = document.createElement('div')
          wrapper.className = 'field'
          const label = document.createElement('label')
          label.htmlFor = 'value-select-' + index
          label.textContent = field.label
          const select = document.createElement('select')
          select.id = 'value-select-' + index
          select.className = 'hidden'
          const input = document.createElement('input')
          input.type = 'text'
          input.autocomplete = 'off'
          input.spellcheck = false
          input.className = 'hidden'
          select.addEventListener('change', () => saveValue(field.key, select.value))
          input.addEventListener('change', () => saveValue(field.key, input.value.trim()))
          wrapper.append(label, select, input)
          fieldsEl.appendChild(wrapper)
          controls.push({ field, select, input })
        })
      }

      function showValues() {
        for (const { field, select, input } of controls) {
          select.value = valueOf(field.key)
          input.value = valueOf(field.key)
        }
      }

      function renderOptions(options, connected) {
        const live = Array.isArray(options) && options.length > 0
        // No live options (Videorc closed or Remote Control off): keep the
        // key configurable with a plain text value instead of a dead end.
        for (const { select, input } of controls) {
          select.classList.toggle('hidden', !live)
          input.classList.toggle('hidden', live)
          if (!live) continue
          select.innerHTML = ''
          const placeholder = document.createElement('option')
          placeholder.value = ''
          placeholder.textContent = 'Choose…'
          select.appendChild(placeholder)
          for (const option of options) {
            const el = document.createElement('option')
            el.value = option.value
            el.textContent = option.label
            select.appendChild(el)
          }
        }
        showValues()
        hintEl.textContent =
          live || connected
            ? action.hint
            : 'Open Videorc and enable Settings → Remote control to pick from a list.'
      }

      // Stream Deck calls this global with connection + action context.
      window.connectElgatoStreamDeckSocket = function (
        inPort,
        inPropertyInspectorUUID,
        inRegisterEvent,
        inInfo,
        inActionInfo
      ) {
        pluginUUID = inPropertyInspectorUUID
        const actionInfo = JSON.parse(inActionInfo)
        actionUUID = actionInfo.action
        action = ACTIONS[actionUUID] || { fields: [{ key: 'value', label: 'Value' }], hint: '' }
        settings = { ...(actionInfo.payload?.settings ?? {}) }
        buildFields()
        renderOptions([], false)

        websocket = new WebSocket('ws://127.0.0.1:' + inPort)
        websocket.onopen = () => {
          send({ event: inRegisterEvent, uuid: inPropertyInspectorUUID })
          // Ask the plugin for live options from Videorc's describe payload.
          send({
            event: 'sendToPlugin',
            action: actionUUID,
            context: inPropertyInspectorUUID,
            payload: { request: 'options' }
          })
        }
        websocket.onmessage = (raw) => {
          let message
          try {
            message = JSON.parse(raw.data)
          } catch {
            return
          }
          if (!message || typeof message !== 'object') {
            return
          }
          if (message.event === 'sendToPropertyInspector') {
            const payload = message.payload || {}
            if (payload.event === 'videorc-options') {
              renderOptions(payload.options, payload.connected === true)
            }
            return
          }
          if (message.event === 'didReceiveSettings') {
            settings = { ...(message.payload?.settings ?? {}) }
            showValues()
          }
        }
      }
    </script>
  </body>
</html>
