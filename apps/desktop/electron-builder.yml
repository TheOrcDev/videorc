appId: dev.theorcdev.videorc
productName: Videorc
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
asar: true
npmRebuild: false
# Auto-update + download channel feed (baked into the app's app-update.yml).
# Release artifacts (dmg/zip/latest-mac.yml/blockmap) are uploaded to every
# configured release storage origin (target: Neon Object Storage; see
# docs/releases/release-runbook.md "Storage origins") and fronted by
# videorc-web; the app reads updates from this URL. The videorc-web
# /api/updates/* route 302s to a presigned object on the primary origin.
#
# BETA: point at the live Vercel host; videorc.com is only a teaser until launch.
# Switch to the production domain when we ship.
# See "plans/planned/2026-06-30 - Videorc Desktop Distribution Channel Plan".
publish:
  provider: generic
  url: https://www.videorc.com/api/updates/

directories:
  buildResources: build-resources
  output: release

files:
  - out/**/*
  - package.json

# Plan 0002 (retest 152). Flipped by electron-builder right before signing, on
# every platform and in test builds too. No harness needs Node in the packaged
# binary: the backend is a Rust process and smokes drive the app through the
# smoke command server or (test builds only) CDP. `pnpm check:packaged-app`
# reads these back from the artifact.
# Left at Electron's defaults until each is proven on macOS and Windows:
# enableEmbeddedAsarIntegrityValidation (Windows needs the resource edit the
# base config skips), enableCookieEncryption (one-way cookie-store migration;
# sign-in must survive the update) and grantFileProtocolExtraPrivileges (the
# renderer still loads from file://).
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true

# Plan 214 B2: embeds and signs the Videorc Camera extension (macOS only; a
# no-op elsewhere). See the comment on mac.entitlements below and
# docs/releases/macos-signing.md, "Videorc Camera".
afterPack: ../../scripts/electron-builder-after-pack-macos.cjs

# Shared across platforms. Platform-specific resources live under mac:/win:
# because electron-builder CONCATENATES global + platform extraResources
# (it does not override) — a global entry with a mac-only path breaks the
# Windows build and vice versa.
extraResources:
  - from: src/renderer/src/assets/videorc-logo.png
    to: videorc-logo.png
  - from: src/renderer/src/assets/backgrounds
    to: background-assets/bundled
    filter:
      - '*.webp'
  # Plan 168 D3: shipped Buddy pet packs (`bundled:<name>` = `<name>/`), the
  # read-only second VIDEORC_MANAGED_BUDDY_ROOTS entry. Pack files only.
  - from: resources/buddy
    to: buddy-assets/bundled
    filter:
      - '**/*'
      - '!.gitkeep'
      - '!README.md'
  # Plan 189: the CC0 starter sounds the backend imports once per profile
  # (`sounds:starter-files` reads the manifest from here).
  - from: resources/sounds/starter
    to: sounds/starter
    filter:
      - '*.ogg'
      - manifest.json
      - LICENSES.md

mac:
  category: public.app-category.video
  extraResources:
    - from: ../../target/release/videorc-backend
      to: videorc-backend
      filter:
        - videorc-backend
    - from: ../../target/release/native_preview_host_helper
      to: native_preview_host_helper
      filter:
        - native_preview_host_helper
    # Plan 209 S4: the stdio bridge agent apps run (`videorc-mcp`). Signed
    # with the rest: @electron/osx-sign walks Contents/Resources and signs
    # every Mach-O it finds, the helper above included, so no `binaries`
    # list is needed; scripts/sign-macos-local-app.mjs and the release
    # validator name it explicitly.
    - from: ../../target/release/videorc-mcp
      to: videorc-mcp
      filter:
        - videorc-mcp
    - from: ../../target/release/videorc_native_preview.node
      to: videorc_native_preview.node
      filter:
        - videorc_native_preview.node
    - from: ../../vendor/ffmpeg/current
      to: ffmpeg
      filter:
        - bin/ffmpeg
        - bin/ffprobe
        - NOTICE.txt
        - SOURCE.txt
        - BUILD-CONFIG.txt
        - licenses/**/*
        - source-patches/**/*
  hardenedRuntime: true
  icon: build-resources/icon.icns
  # Plan 214 B2 (Videorc Camera; shape proven by spike P0a on macOS 26, SIP on,
  # notarized). The app and its helpers no longer share one plist:
  # - `entitlements` (the app itself) is GENERATED on every macOS pack by the
  #   afterPack hook (top of this file) into the gitignored build/ dir: the five
  #   keys of build-resources/entitlements.mac.plist, plus the restricted
  #   com.apple.developer.system-extension.install, the app group and the
  #   application/team identifiers ONLY when VIDEORC_MACOS_PROFILE_APP is set
  #   (the one Developer ID profile, for the app). A restricted key without its
  #   embedded profile gets the app killed by AMFI at launch, so the hook never
  #   writes it without the profile. @electron/osx-sign applies this plist to
  #   the top-level app only (app-builder-lib macPackager getOptionsForFile:
  #   `filePath === appPath`), i.e. to the main executable.
  # - `entitlementsInherit` signs everything else: every nested Mach-O, Electron's
  #   frameworks and helpers, crashpad, ShipIt, and the bare binaries in
  #   Contents/Resources (videorc-backend, preview helper, videorc-mcp, the .node
  #   addon, ffmpeg). Exactly the five pre-camera keys, never a restricted one: a
  #   binary without a profile dies at exec with SIGKILL, silently.
  # - `signIgnore` keeps @electron/osx-sign away from the extension's Mach-O:
  #   osx-sign walks Mach-O files, .app and .framework bundles but never treats
  #   a .systemextension as a bundle, so it would re-sign the binary as a bare
  #   file with the inherit plist and break the seal. The hook signs the whole
  #   .systemextension with its own two entitlements (app sandbox, app group;
  #   no profile) before the app is signed, so the app seals it as nested code.
  # osx-sign signs nested code deepest first and the app last, never --deep.
  # The app profile is embedded by the hook (Contents/embedded.provisionprofile;
  # osx-sign keeps an existing one), not through `provisioningProfile`: that key
  # cannot be conditional in YAML and electron-builder fails when the file it
  # names is missing (no-profile builds).
  entitlements: build/camera-extension/entitlements.mac.app.plist
  entitlementsInherit: build-resources/entitlements.mac.inherit.plist
  signIgnore:
    - /Contents/Library/SystemExtensions/
  # Signed + notarized for Developer ID distribution. The cert is the keychain's
  # "Developer ID Application: Uros Miric (C2PA37RB58)" — electron-builder
  # auto-detects it. In electron-builder 26 `notarize` is a boolean; the notary
  # credentials come from the environment (the `dist:release` script bakes
  # APPLE_TEAM_ID; you supply the other two):
  #   APPLE_TEAM_ID                C2PA37RB58 (set by dist:release)
  #   APPLE_ID                     your Apple ID email
  #   APPLE_APP_SPECIFIC_PASSWORD  appleid.apple.com -> Sign-In and Security
  #                                -> App-Specific Passwords
  # The unsigned `dist`/`package` scripts override this to false.
  notarize: true
  extendInfo:
    NSCameraUseContinuityCameraDeviceType: true
    NSCameraUsageDescription: Videorc uses the camera for creator overlays when you select a camera source.
    NSMicrophoneUsageDescription: Videorc uses the microphone when you select a microphone for recording or streaming.
    NSScreenCaptureDescription: Videorc captures your screen or selected windows only when you start a recording or stream.
    NSDocumentsFolderUsageDescription: Videorc can save recordings to a folder you choose.
    NSDownloadsFolderUsageDescription: Videorc can save exports to a folder you choose.
  # zip is required for macOS auto-update (electron-updater pulls the zip, not the
  # dmg). dmg = first-time human download; dir = the unpacked .app.
  target:
    - dir
    - dmg
    - zip

# Windows 11 x64. Unsigned for now (internal testing); Authenticode signing is
# Phase 5. The .exe backend and the windows-x64 ffmpeg dir override the
# top-level (macOS) extraResources paths. See docs/windows-port-plan.md.
#
# signAndEditExecutable:false skips winCodeSign/rcedit. On Windows without
# Developer Mode (or admin), extracting winCodeSign fails on unused macOS
# dylib symlinks ("Cannot create symbolic link : A required privilege is not
# held by the client"). Safe while we ship unsigned; re-enable for Authenticode
# / icon resource editing and require Developer Mode or an elevated extract.
# https://github.com/electron-userland/electron-builder/issues/8149
win:
  signAndEditExecutable: false
  icon: build-resources/icon.ico
  extraResources:
    # Host-target build: `pnpm package:backend` on the Windows box puts the
    # exe in target/release/, not target/<triple>/release/.
    - from: ../../target/release/videorc-backend.exe
      to: videorc-backend.exe
    # Plan 209 S4: unsigned inside the installer like videorc-backend.exe
    # (electron-builder signs the app exe and the installer, not
    # extraResources); agent apps point at resources\videorc-mcp.exe.
    - from: ../../target/release/videorc-mcp.exe
      to: videorc-mcp.exe
    # The WER module the backend registers beside itself so heap-corruption
    # (fail-fast) crashes still leave a minidump; see crates/videorc-wer-helper.
    - from: ../../target/release/videorc_wer_helper.dll
      to: videorc_wer_helper.dll
    - from: ../../vendor/ffmpeg/windows-x64
      to: ffmpeg
      filter:
        - bin/ffmpeg.exe
        # The backend resolves ffprobe as a sibling of the bundled ffmpeg
        # (ffmpeg.rs); repair/import/probe break without it.
        - bin/ffprobe.exe
        - bin/ffmpeg-capture.exe
        - capture/**/*
        - LICENSE.txt
        - SOURCE.txt
  target:
    - dir
    - nsis

# Linux x64 AppImage (port plan L6, Plan 0008). Unsigned; the Linux Alpha
# lane is candidate-only until the Ubuntu 24.04 tester box proves it (see
# docs/linux-port-plan.md). The release backend and the pinned LGPL Linux
# FFmpeg pair (fetch-ffmpeg-linux.mjs verifies configure flags and the
# h264_vaapi + libopenh264 encoder table) ride as extraResources, so the
# packaged app resolves them from process.resourcesPath exactly like the
# macOS and Windows builds. The icon is derived from icon.icns.
#
# Hardcode x64 in the AppImage filename. On Linux AppImage builds,
# electron-builder expands ${arch} to x86_64, which produces
# Videorc-<version>-linux-x86_64.AppImage and fails the Linux Alpha
# release contract (Videorc-<version>-linux-x64.AppImage).
linux:
  artifactName: ${productName}-${version}-${os}-x64.${ext}
  category: Video
  executableName: videorc
  maintainer: TheOrcDev
  # The bundled videorc.desktop names the videorc:// handler too (AppImage
  # integration tools copy it). The app writes its own user entry on launch;
  # see src/main/linux-desktop-entry.ts.
  mimeTypes:
    - x-scheme-handler/videorc
  extraResources:
    - from: ../../target/release/videorc-backend
      to: videorc-backend
      filter:
        - videorc-backend
    # Plan 209 S4, D20: Connect copies this to ~/.local/share/videorc/bin/
    # because the AppImage mounts at a new path each launch.
    - from: ../../target/release/videorc-mcp
      to: videorc-mcp
      filter:
        - videorc-mcp
    - from: ../../vendor/ffmpeg/linux-x64
      to: ffmpeg
      filter:
        - bin/ffmpeg
        - bin/ffprobe
        - LICENSE.txt
        - SOURCE.txt
        - BUILD-CONFIG.txt
  target:
    - dir
    - AppImage

# Install window, designed in Dmgly. The background already carries the
# "Drag to Applications" text, the arrow and both label pills; Finder supplies
# the real icons and filenames. Positions are icon centres in points and must
# stay aligned with the baked-in pills. Finder shows only the GIF's first frame.
dmg:
  background: build-resources/dmgly/assets/dmg-background.gif
  window:
    width: 642
    height: 406
  iconSize: 128
  contents:
    - x: 152
      y: 92
      type: file
    - x: 515
      y: 258
      type: link
      path: /Applications

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
