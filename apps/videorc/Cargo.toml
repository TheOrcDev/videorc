[package]
name = "videorc-app"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
description = "Plan 260: The Videorc binary on GPUI: windows, screens, the preview element's GPUI side, OS integration, the smoke UI driver."

[[bin]]
name = "Videorc"
path = "src/main.rs"

[dependencies]
# The smoke command server and the UI driver (`src/smoke/`, plan 260 S2.5,
# L6). S2.1 (L4) adds the shell's own dependencies beside these.
gpui = { workspace = true }
videorc-app-core = { workspace = true }
raw-window-handle = "0.6"
serde_json = "1.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The driver asks its own window's view for its accessibility children, as
# VoiceOver does first, so GPUI builds the tree in a smoke run.
objc2 = { version = "0.6.4" }

[target.'cfg(target_os = "windows")'.dependencies]
# The same question on Windows: `WM_GETOBJECT` to its own window.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

