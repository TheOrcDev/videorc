[package]
name = "videorc-app"
# Not the app's version: that is apps/desktop/package.json's, compiled in by
# build.rs as VIDEORC_APP_VERSION (`APP_VERSION`).
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
description = "Plan 260: The Videorc binary on GPUI: windows, screens, the preview element's GPUI side, OS integration, the smoke UI driver."

[[bin]]
name = "Videorc"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
# GPUI, pinned once in the root manifest (plan 260 D1). The platform's
# features are the app's: `font-kit` on macOS, `wayland`/`x11` on Linux, and
# `runtime_shaders`, which compiles the Metal shaders at run time so a build
# needs no Metal Toolchain (development; CI's release build sets it aside
# once the runner has the toolchain).
gpui = { workspace = true }
gpui_platform = { workspace = true, features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
# InputEvent for Notes' TextareaState subscription (kit Textarea twin).
gpui_base = { workspace = true }
# The design system (plan 260 Phase 3): the kit synced from videorc-ui's
# GPUI flavour, which every screen draws with.
videorc-kit = { workspace = true }
# Avatar's inspiration picture, fitted and shrunk under 3 MB before it is
# sent (PNG, JPEG, lossless WebP). The codecs are the ones GPUI already
# builds `image` with, so this adds no new code to the build.
image = { workspace = true, features = ["jpeg", "png", "webp"] }
# The core: the supervisor, the logs, the typed client, the stores.
videorc-app-core = { workspace = true }
# The Session section's clock for the core's on-air facts.
chrono = "0.4"
# New scene ids (the Scene page's Duplicate, plan 260 Phase 3).
uuid = { version = "1.19", features = ["v4"] }
# The core's own runtime (two workers), beside GPUI's executor.
tokio = { version = "1.48", features = ["rt-multi-thread", "sync", "time", "macros"] }
# The preview element (plan 260 S2.3a, L1): the presenter, the lease feed,
# the contracts and the slots' words; and the wire types its scene speaks.
videorc-preview = { workspace = true }
videorc-protocol = { workspace = true }
# Global shortcuts (S2.6a part 2): Carbon on macOS, RegisterHotKey on
# Windows, X11 on Linux, behind the core's gate.
global-hotkey = "0.7"
# The smoke command server (`src/smoke/`, plan 260 S2.5, L6), the backend's admin requests
# and untyped event payloads (Videorc Camera).
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Public release notes only; same HTTP/TLS version already used by the backend.
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
# The smoke UI driver and the OS interface (`src/platform/`, S2.6a): raw-window-handle
# reaches the native window under a GPUI window on every platform; the
# preview's layer reaches its NSView through it too (S2.3a).
raw-window-handle = "0.6"

# Linux (plan 260 S2.6c, lane L5): the GlobalShortcuts portal through ashpd,
# and the session bus (Inhibit, ScreenSaver, Secret Service) through ashpd's
# zbus. Both are in the tree already through the backend's portal capture.
# `async-io`, not `tokio`: gpui-pre-linux asks for ashpd with `async-io`, and
# ashpd refuses both at once (a compile_error). zbus then runs its own
# executor thread, so awaiting it on the app's tokio runtime still works.
[build-dependencies]
# build.rs reads the release version from apps/desktop/package.json.
serde_json = "1.0"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "global_shortcuts"] }
futures-util = "0.3"
# Follow the app in front on X11 (`_NET_ACTIVE_WINDOW`); same crate the
# preview's X11 child already uses. `screensaver`: the watchdog's
# still-there idle time on X11 (`platform/idle.rs`).
x11rb = { version = "0.13", features = ["screensaver"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The smoke driver asks its own window's view for its accessibility children,
# as VoiceOver does first, so GPUI builds the tree in a smoke run (L6).
# AppKit and IOKit, as spike S0.7 proved them under GPUI 0.3.14 (S2.6a).
# The preview's layer in a GPUI `NativeView` (S0.1's route, S2.3a): the
# QuartzCore bindings and AppKit's quartz-core feature.
objc2 = { version = "0.6.4" }
objc2-foundation = "0.3.2"
objc2-app-kit = { version = "0.3.2", features = ["NSView", "NSWindow", "NSResponder", "NSPanel", "NSGraphics", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3.2", features = ["CALayer", "CAMetalLayer", "CATransaction", "objc2-metal"] }
# First-run setup's moving backdrop (`screens/first_run/backdrop.rs`): the
# backend's Liquid Chrome pass drawn into a layer of the app's own, as the
# preview's presenter draws (the same bindings `videorc-preview` builds).
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLDevice", "MTLCommandQueue", "MTLCommandBuffer", "MTLCommandEncoder", "MTLRenderCommandEncoder", "MTLRenderPass", "MTLRenderPipeline", "MTLLibrary", "MTLTexture", "MTLPixelFormat", "MTLResource", "MTLTypes", "MTLSampler", "MTLDrawable", "objc2-core-foundation"] }
# The camera, microphone and screen grants (S2.6a part 3), read and asked
# for as the Rust app does: AVFoundation's authorization status and prompt
# (a block2 completion handler), CoreGraphics' screen capture access.
block2 = "0.6.1"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["AVCaptureDevice", "AVMediaFormat"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGWindow"] }
# Videorc Camera's system extension request (S2.6a part 4), answered on
# GCD's main queue.
dispatch2 = { version = "0.3.1", default-features = false, features = ["std", "objc2"] }
objc2-system-extensions = { version = "0.3.2", default-features = false, features = ["std", "dispatch2"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Hide from stream (`SetWindowDisplayAffinity`), Follow (`SetWinEventHook` /
# `GetForegroundWindow` + process image path), and the smoke driver's
# `WM_GETOBJECT` to its own window. `Win32_Globalization`: the user
# locale and time format dates follow (`platform::system_date_style`).
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
] }
# The camera and microphone grants (`media_access`): WinRT's
# `DeviceAccessInformation`, what Electron's `getMediaAccessStatus` reads on
# Windows. The backend already builds this version.
windows = { version = "0.62", features = ["Devices_Enumeration", "Foundation"] }
