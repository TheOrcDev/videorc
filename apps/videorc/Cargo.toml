[package]
name = "videorc-app"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
description = "Plan 260: The Videorc binary on GPUI: windows, screens, the preview element's GPUI side, OS integration, the smoke UI driver."

[[bin]]
name = "Videorc"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
# GPUI, pinned once in the root manifest (plan 260 D1). The platform's
# features are the app's: `font-kit` on macOS, `wayland`/`x11` on Linux, and
# `runtime_shaders`, which compiles the Metal shaders at run time so a build
# needs no Metal Toolchain (development; CI's release build sets it aside
# once the runner has the toolchain).
gpui = { workspace = true }
gpui_platform = { workspace = true, features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
# The core: the supervisor, the logs, the typed client, the stores.
videorc-app-core = { workspace = true }
# The core's own runtime (two workers), beside GPUI's executor.
tokio = { version = "1.48", features = ["rt-multi-thread", "sync", "time", "macros"] }

# Global shortcuts (S2.6a part 2): Carbon on macOS, RegisterHotKey on
# Windows, X11 on Linux, behind the core's gate.
global-hotkey = "0.7"
# The OS interface (`src/platform/`, S2.6a). raw-window-handle reaches the
# native window under a GPUI window on every platform.
raw-window-handle = "0.6"

# macOS: AppKit and IOKit, as spike S0.7 proved them under GPUI 0.3.14.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3.2"
objc2-app-kit = { version = "0.3.2", features = ["NSView", "NSWindow", "NSResponder", "NSPanel", "NSGraphics"] }
